<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="668px" preserveAspectRatio="none" style="width:1155px;height:668px;background:#FFFFFF;" version="1.1" viewBox="0 0 1155 668" width="1155px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="96"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="273.4648" x="437.5176" y="23.5352">Append and Edit Transaction Protocol</text></g><!--cluster transaction--><g class="cluster" data-qualified-name="transaction" data-source-line="124" id="ent0002"><path d="M19,121.4883 L202.1748,121.4883 A7.5,7.5 0 0 1 207.1748,126.4883 L214.1748,143.9766 L691,143.9766 A5,5 0 0 1 696,148.9766 L696,655.4883 A5,5 0 0 1 691,660.4883 L19,660.4883 A5,5 0 0 1 14,655.4883 L14,126.4883 A5,5 0 0 1 19,121.4883" fill="none" style="stroke:#7A8699;stroke-width:1.5;"/><line style="stroke:#7A8699;stroke-width:1.5;" x1="14" x2="214.1748" y1="143.9766" y2="143.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="187.1748" x="18" y="137.0234">One GaussDB Transaction</text></g><!--entity request--><g class="entity" data-qualified-name="request" data-source-line="122" id="ent0001"><rect fill="#DCEBFF" height="52.9766" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="332.7646" x="194.5" y="41.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.7295" x="204.5" y="65.0234">WRITE REQUEST</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="312.7646" x="204.5" y="81.5117">AppendEntryDTO or EditLastUserMessageDTO</text></g><!--entity rollback--><g class="entity" data-qualified-name="rollback" data-source-line="143" id="ent0014"><rect fill="#FDE8E7" height="69.4648" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="443.4385" x="704.5" y="287.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.7344" x="714.5" y="311.0234">FAIL CLOSED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="422.1465" x="714.5" y="327.5117">Any validation or DML failure rolls back the entire transaction.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="423.4385" x="714.5" y="344">Sequence, summary, and current path end remain unchanged.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="149" id="ent0019"><path d="M706,439.4883 L706,458.4883 L687.5684,462.4883 L706,466.4883 L706,485.4199 A5,5 0 0 0 711,490.4199 L1022.8535,490.4199 A5,5 0 0 0 1027.8535,485.4199 L1027.8535,444.4883 L1017.8535,434.4883 L711,434.4883 A5,5 0 0 0 706,439.4883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><path d="M1017.8535,434.4883 L1017.8535,441.9883 A2.5,2.5 0 0 0 1020.3535,444.4883 L1027.8535,444.4883 L1017.8535,434.4883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5459" x="712" y="452.0566">Before BEGIN, edit requests make a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.4795" x="712" y="467.3672">best-effort cancellation of the old Run.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.8535" x="712" y="482.6777">The database state check is the final safeguard.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="155" id="ent0022"><path d="M704,562.9883 L704,597.4883 L661.0957,601.4883 L704,605.4883 L704,639.541 A5,5 0 0 0 709,644.541 L1006.8252,644.541 A5,5 0 0 0 1011.8252,639.541 L1011.8252,567.9883 L1001.8252,557.9883 L709,557.9883 A5,5 0 0 0 704,562.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><path d="M1001.8252,557.9883 L1001.8252,565.4883 A2.5,2.5 0 0 0 1004.3252,567.9883 L1011.8252,567.9883 L1001.8252,557.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.6123" x="710" y="575.5566">Lock order is always:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.3706" x="710" y="590.8672">1. t_sessions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.2021" x="710" y="606.1777">2. t_session_sequences</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="710" y="621.4883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.8252" x="710" y="636.7988">External Tool side effects are not rolled back.</text></g><!--entity stateCheck--><g class="entity" data-qualified-name="transaction.stateCheck" data-source-line="125" id="ent0003"><rect fill="#FFE9CC" height="102.4414" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="344.4883" x="189" y="148.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.3271" x="199" y="172.0234">1  CHECK CURRENT STATE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1338" x="199" y="188.5117">BEGIN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.8838" x="199" y="205">Lock t_sessions FOR UPDATE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="324.4883" x="199" y="221.4883">Check expectedParentEntryId or expectedLeafId</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.0693" x="199" y="237.9766">Reject stale state</text></g><!--entity sequence--><g class="entity" data-qualified-name="transaction.sequence" data-source-line="127" id="ent0004"><rect fill="#FFE9CC" height="69.4648" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="286.7793" x="217.5" y="287.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.9658" x="227.5" y="311.0234">2  SEQUENCE ALLOCATION</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266.7793" x="227.5" y="327.5117">Lock t_session_sequences FOR UPDATE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.1309" x="227.5" y="344">Allocate the next entry_seq</text></g><!--entity append--><g class="entity" data-qualified-name="transaction.append" data-source-line="129" id="ent0005"><rect fill="#E4F4E8" height="85.9531" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="328.1846" x="22" y="419.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.7285" x="32" y="443.0234">3A  APPEND MUTATION</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266.6494" x="32" y="459.5117">Reject leaf, branch_summary, and label</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.8643" x="32" y="476">Insert entry with parent = expected parent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.1846" x="32" y="492.4883">Increment activePath and usage as applicable</text></g><!--entity edit--><g class="entity" data-qualified-name="transaction.edit" data-source-line="131" id="ent0006"><rect fill="#EEE8FF" height="102.4414" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="318.9082" x="368.5" y="411.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.5293" x="378.5" y="435.0234">3B  EDIT MUTATION</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="236.0449" x="378.5" y="451.5117">Validate the complete current path</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="264.3457" x="378.5" y="468">Require target = nearest user message</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="298.9082" x="378.5" y="484.4883">Insert sibling with parent = target.parent_id</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.2881" x="378.5" y="500.9766">Rebuild activePath; keep lifetimeUsage</text></g><!--entity commit--><g class="entity" data-qualified-name="transaction.commit" data-source-line="133" id="ent0007"><rect fill="#DCEBFF" height="102.4414" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="266.2715" x="395" y="550.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.873" x="405" y="574.0234">4  ATOMIC COMMIT</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.5957" x="405" y="590.5117">Advance next_seq</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.8047" x="405" y="607">Persist materialized payload</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="246.2715" x="405" y="623.4883">Move active_leaf_id to the new entry</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5654" x="405" y="639.9766">COMMIT</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk8"><polygon fill="#53657D" points="361,287.3823,365,278.3823,361,282.3823,357,278.3823,361,287.3823" style="stroke:#53657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M361,250.5443 C361,262.9595 361,270.9695 361,282.3823" fill="none" style="stroke:#53657D;stroke-width:1.2;"/></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" id="lnk9"><polygon fill="#53657D" points="239.2632,419.3343,248.8027,416.8855,243.1838,416.2313,243.838,410.6125,239.2632,419.3343" style="stroke:#53657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M318.6374,356.5153 C294.7646,375.4088 268.6397,396.0849 243.1838,416.2313" fill="none" style="stroke:#53657D;stroke-width:1.2;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.0361" x="296" y="389.0566">append</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" id="lnk10"><polygon fill="#53657D" points="467.3955,411.2265,463.0214,402.4023,463.5469,408.0346,457.9145,408.5601,467.3955,411.2265" style="stroke:#53657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M401.426,356.5153 C421.215,372.9271 441.6001,389.8333 463.5469,408.0346" fill="none" style="stroke:#53657D;stroke-width:1.2;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.0449" x="446" y="389.0566">edit</text></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" id="lnk11"><polygon fill="#53657D" points="403.1234,550.4646,396.2562,543.4047,398.4819,548.6053,393.2813,550.831,403.1234,550.4646" style="stroke:#53657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M290.9355,505.5238 C326.3771,519.7212 361.6514,533.8516 398.4819,548.6053" fill="none" style="stroke:#53657D;stroke-width:1.2;"/></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" id="lnk12"><polygon fill="#53657D" 
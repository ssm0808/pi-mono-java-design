<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="652px" preserveAspectRatio="none" style="width:816px;height:652px;background:#FFFFFF;" version="1.1" viewBox="0 0 816 652" width="816px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="96"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="311.3359" x="248.832" y="23.5352">Append-Only Session Transaction Protocol</text></g><!--cluster transaction--><g class="cluster" data-qualified-name="transaction" data-source-line="125" id="ent0002"><path d="M19,121.4883 L202.1748,121.4883 A7.5,7.5 0 0 1 207.1748,126.4883 L214.1748,143.9766 L353,143.9766 A5,5 0 0 1 358,148.9766 L358,639.4883 A5,5 0 0 1 353,644.4883 L19,644.4883 A5,5 0 0 1 14,639.4883 L14,126.4883 A5,5 0 0 1 19,121.4883" fill="none" style="stroke:#7A8699;stroke-width:1.5;"/><line style="stroke:#7A8699;stroke-width:1.5;" x1="14" x2="214.1748" y1="143.9766" y2="143.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="187.1748" x="18" y="137.0234">One GaussDB Transaction</text></g><!--entity request--><g class="entity" data-qualified-name="request" data-source-line="123" id="ent0001"><rect fill="#DCEBFF" height="52.9766" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="137.3525" x="101.5" y="41.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.7295" x="111.5" y="65.0234">WRITE REQUEST</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.3525" x="111.5" y="81.5117">AppendEntryDTO</text></g><!--entity rollback--><g class="entity" data-qualified-name="rollback" data-source-line="139" id="ent0010"><rect fill="#FDE8E7" height="69.4648" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="442.1465" x="366" y="287.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86.7344" x="376" y="311.0234">FAIL CLOSED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="422.1465" x="376" y="327.5117">Any validation or DML failure rolls back the entire transaction.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="385.9434" x="376" y="344">Sequence, summary, and latest Entry remain unchanged.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="145" id="ent0015"><path d="M366,546.9883 L366,581.4883 L340.2695,585.4883 L366,589.4883 L366,623.541 A5,5 0 0 0 371,628.541 L668.8252,628.541 A5,5 0 0 0 673.8252,623.541 L673.8252,551.9883 L663.8252,541.9883 L371,541.9883 A5,5 0 0 0 366,546.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><path d="M663.8252,541.9883 L663.8252,549.4883 A2.5,2.5 0 0 0 666.3252,551.9883 L673.8252,551.9883 L663.8252,541.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.6123" x="372" y="559.5566">Lock order is always:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="81.3706" x="372" y="574.8672">1. t_sessions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.2021" x="372" y="590.1777">2. t_session_sequences</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="372" y="605.4883">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.8252" x="372" y="620.7988">External Tool side effects are not rolled back.</text></g><!--entity stateCheck--><g class="entity" data-qualified-name="transaction.stateCheck" data-source-line="126" id="ent0003"><rect fill="#FFE9CC" height="102.4414" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="291.2432" x="24.5" y="148.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.3271" x="34.5" y="172.0234">1  CHECK CURRENT STATE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.1338" x="34.5" y="188.5117">BEGIN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.8838" x="34.5" y="205">Lock t_sessions FOR UPDATE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="271.2432" x="34.5" y="221.4883">Recheck execution and expected parent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.0693" x="34.5" y="237.9766">Reject stale state</text></g><!--entity sequence--><g class="entity" data-qualified-name="transaction.sequence" data-source-line="128" id="ent0004"><rect fill="#FFE9CC" height="69.4648" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="286.7793" x="38.5" y="287.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.9658" x="48.5" y="311.0234">2  SEQUENCE ALLOCATION</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266.7793" x="48.5" y="327.5117">Lock t_session_sequences FOR UPDATE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.1309" x="48.5" y="344">Allocate the next entry_seq</text></g><!--entity append--><g class="entity" data-qualified-name="transaction.append" data-source-line="130" id="ent0005"><rect fill="#E4F4E8" height="85.9531" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="328.1846" x="22" y="411.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.0693" x="32" y="435.0234">3  APPEND MUTATION</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="266.6494" x="32" y="451.5117">Reject leaf, branch_summary, and label</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.8643" x="32" y="468">Insert entry with parent = expected parent</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308.1846" x="32" y="484.4883">Increment activePath and usage as applicable</text></g><!--entity commit--><g class="entity" data-qualified-name="transaction.commit" data-source-line="132" id="ent0006"><rect fill="#DCEBFF" height="102.4414" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="266.2715" x="74" y="534.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.873" x="84" y="558.0234">4  ATOMIC COMMIT</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.5957" x="84" y="574.5117">Advance next_seq</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.8047" x="84" y="591">Persist materialized payload</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="246.2715" x="84" y="607.4883">Move active_leaf_id to the new entry</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5654" x="84" y="623.9766">COMMIT</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" id="lnk7"><polygon fill="#53657D" points="178.6533,287.3823,181.7418,278.0302,178.1579,282.4069,173.7812,278.823,178.6533,287.3823" style="stroke:#53657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M174.9848,250.5443 C176.2212,262.9595 177.0213,270.9941 178.1579,282.4069" fill="
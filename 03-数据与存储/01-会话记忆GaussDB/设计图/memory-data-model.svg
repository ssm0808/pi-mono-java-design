linear timeline.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="322.0991" x="716.5" y="502.3672">Compaction does not erase history or billed usage.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.4028" x="716.5" y="517.6777">Runtime event and stats tables are maintained separately.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="243" id="ent0020"><path d="M316.5,329.9883 L316.5,362.6094 A4,4 0 0 0 320.5,366.6094 L746.4277,366.6094 A4,4 0 0 0 750.4277,362.6094 L750.4277,335.9883 L740.4277,325.9883 L536.309,325.9883 L525.1199,205.6054 L528.309,325.9883 L320.5,325.9883 A4,4 0 0 0 316.5,329.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><path d="M740.4277,325.9883 L740.4277,333.9883 A2,2 0 0 0 742.4277,335.9883 L750.4277,335.9883 L740.4277,325.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.8218" x="322.5" y="343.5566">Dashed lines are logical relations, not physical foreign keys.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.9277" x="322.5" y="358.8672">Service transactions validate ownership, leaf, and sequence state.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" id="lnk9"><polygon fill="#53657D" points="103.7086,260.3725,105.8658,250.7628,102.728,255.4696,98.0211,252.3318,103.7086,260.3725" style="stroke:#53657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M370.4622,143.858 C267.5227,157.8595 143.8909,182.7116 111.5,223.4883 C102.7185,234.5433 100.1189,242.4248 102.728,255.4696" fill="none" style="stroke:#53657D;stroke-width:1.2;stroke-dasharray:7,7;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.3662" x="113.
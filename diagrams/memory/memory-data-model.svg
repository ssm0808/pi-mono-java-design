,327.4383 L578.59,359.0583 L279.92,363.0583 L578.59,367.0583 L578.59,398.6805 A0,0 0 0 0 578.59,398.6805 L951.8976,398.6805 A0,0 0 0 0 951.8976,398.6805 L951.8976,337.4383 L941.8976,327.4383 L578.59,327.4383 A0,0 0 0 0 578.59,327.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M941.8976,327.4383 L941.8976,337.4383 L951.8976,337.4383 L941.8976,327.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.314" x="584.59" y="345.0066">entry_seq is append order, not path membership.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.0728" x="584.59" y="360.3172">Ordinary reads follow parent_id from active_leaf_id.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.3979" x="584.59" y="375.6277">An edit inserts a sibling of the replaced user entry.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.3076" x="584.59" y="390.9383">Old descendants remain available to internal audit only.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="236" id="ent0014"><path d="M1292.87,335.0883 L1292.87,359.0583 L1257.75,363.0583 L1292.87,367.0583 L1292.87,391.0199 A0,0 0 0 0 1292.87,391.0199 L1699.6361,391.0199 A0,0 0 0 0 1699.6361,391.0199 L1699.6361,345.0883 L1689.6361,335.0883 L1292.87,335.0883 A0,0 0 0 0 1292.87,335.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1689.6361,335.0883 L1689.6361,345.0883 L1699.6361,345.0883 L1689.6361,335.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.6318" x="1298.87" y="352.6566">activePath is rebuilt after edit and fork.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.7661" x="1298.87" y="367.9672">lifetimeUsage never decreases when the active path changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.1392" x="1298.87" y="383.2777">The projection can be rebuilt from committed entries.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="242" id="ent0017"><path d="M1981.59,335.0883 L1981.59,391.0199 L2316.9069,391.0199 L2316.9069,345.0883 L2306.9069,335.0883 L1981.59,335.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2306.9069,335.0883 L2306.9069,345.0883 L2316.9069,345.0883 L2306.9069,335.0883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.3169" x="1987.59" y="352.6566">There are no physical foreign keys in this version.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.2759" x="1987.59" y="367.9672">Service transactions validate the active leaf,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.8818" x="1987.59" y="383.2777">parent ownership, and sequence row.</text></g><!--link sessions to entries--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="association" data-source-line="222" id="lnk5"><path codeLine="222" d="M972.12,144.8083 C853.63,163.2383 684.63,192.6883 539.25,230.0383 C451.69,252.5383 355.43,284.4583 279.74,311.2783" fill="none" id="sessions-entries" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.6304" x="540.25" y="243.6066">logical session ownership</text></g><!--link sessions to entries--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="association" data-source-line="223" id="lnk6"><path code
><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="258.4189" x="811" y="400.6094">lifetimeUsage : committed usage total</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="239" id="ent0014"><path d="M6,473.4883 L6,521.4199 A4,4 0 0 0 10,525.4199 L387.6538,525.4199 A4,4 0 0 0 391.6538,521.4199 L391.6538,479.4883 L381.6538,469.4883 L203,469.4883 L199,432.8667 L195,469.4883 L10,469.4883 A4,4 0 0 0 6,473.4883" fill="#EAF6ED" style="stroke:#B58B00;stroke-width:0.5;"/><path d="M381.6538,469.4883 L381.6538,477.4883 A2,2 0 0 0 383.6538,479.4883 L391.6538,479.4883 L381.6538,469.4883" fill="#EAF6ED" style="stroke:#B58B00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.833" x="12" y="487.0566">parent_id defines path membership.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.314" x="12" y="502.3672">entry_seq is append order, not path membership.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.6538" x="12" y="517.6777">An edit inserts a sibling; old descendants stay audit-only.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="245" id="ent0017"><path d="M736.5,473.4883 L736.5,521.4199 A4,4 0 0 0 740.5,525.4199 L1139.2661,525.4199 A4,4 0 0 0 1143.2661,521.4199 L1143.2661,479.4883 L1133.2661,469.4883 L944,469.4883 L940,408.0923 L936,469.4883 L740.5,469.4883 A4,4 0 0 0 736.5,473.4883" fill="#F5F0FF" style="stroke:#B58B00;stroke-width:0.5;"/><path d="M1133.2661,469.4883 L1133.2661,477.4883 A2,2 0 0 0 1135.2661,479.4883 L1143.2661,479.4883 L1133.2661,469.4883" fill="#F5F0FF" style="stroke:#B58B00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.6318" x="742.5" y="487.0566">activePath is rebuilt after edit and fork.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.7661" x="742.5" y="502.3672">lifetimeUsage never decreases when the active path changes.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.5674" x="742.5" y="517.6777">Both values are rebuildable from committed entries.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="251" id="ent0020"><path d="M353,329.9883 L353,362.6094 A4,4 0 0 0 357,366.6094 L782.9277,366.6094 A4,4 0 0 0 786.9277,362.6094 L786.9277,335.9883 L776.9277,325.9883 L572.809,325.9883 L561.6199,205.6054 L564.809,325.9883 L357,325.9883 A4,4 0 0 0 353,329.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><path d="M776.9277,325.9883 L776.9277,333.9883 A2,2 0 0 0 778.9277,335.9883 L786.9277,335.9883 L776.9277,325.9883" fill="#FFF8D9" style="stroke:#B58B00;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.8218" x="359" y="343.5566">Dashed lines are logical relations, not physical foreign keys.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.9277" x="359" y="358.8672">Service transactions validate ownership, leaf, and sequence state.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" id="lnk9"><polygon fill="#53657D" points="149.2558,260.2196,151.9468,250.7455,148.5508,255.2696,144.0268,251.8735,149.2558,260.2196" style="stroke:#53657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M406.8905,144.8895 C307.2056,159.2315 189.1438,184.0588 158,223.4883 C149.4131,234.3598 146.6853,242.1712 148.5508,255.2696" fill="none" style="stroke:#53657D;stroke-width:1.2;stroke-dasharray:7,7;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.3662" x="160" y="238.0566">owns immutable entries</text></g><
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: CampusMate File Service API
  version: 3.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    mate-service 文件服务目标契约。公共接口按 chat_id 鉴权，内部接口按
    session_id 为 CampusClaw 解析文件。file_id 是唯一资源 ID，同时是私有
    OBS 的完整 Object Key；不存在第二套文件资源 ID 或 Object Key 映射。

    普通 JSON 成功响应使用 resCode/resMsg/result，异常响应仅使用
    resCode/resMsg。二进制 content 响应不包装。JSON 字段使用 lowerCamelCase。
    本契约是 待实现 design，不表示现有 Java 服务已实现这些 operation。
servers:
  - url: https://{host}/mate-service
    description: 部署网关；host 由环境配置
    variables:
      host:
        default: api.campusmate.internal
tags:
  - name: Public files
    description: CampusMate 客户端使用的 Chat 文件接口
  - name: Internal runtime
    description: CampusClaw 使用的内部文件解析和内容流接口
paths:
  /v1/chats/{chat_id}/attachments:
    post:
      tags: [Public files]
      operationId: uploadFile
      summary: 流式上传单个文件
      description: |
        验证 JWT 和 Chat 后解析内部 session_id，生成 file_id，并以该 ID
        作为完整 OBS Object Key。上传使用 create-only，实际字节数必须与
        X-File-Size 一致。省略 Prefer 或 respond-async 时在 PROCESSING
        提交后返回 202；wait=N 最多等待 10 秒。
      security:
        - CallerId: []
          BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/FileSize'
        - $ref: '#/components/parameters/Prefer'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    唯一 file part，必须携带 filename。服务端进行 NFC 规范化，
                    清除控制字符和路径分隔符；调用方 Content-Type 不可信。
      responses:
        '201':
          description: wait 窗口内完成扫描，文件已 READY
          headers:
            Location:
              $ref: '#/components/headers/FileLocation'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResourceResponse'
              examples:
                ready:
                  $ref: '#/components/examples/ReadyFileResponse'
        '202':
          description: 文件正文已持久化，正在异步扫描
          headers:
            Location:
              $ref: '#/components/headers/FileLocation'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResourceResponse'
              examples:
                processing:
                  $ref: '#/components/examples/ProcessingFileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ChatNotFound'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '422':
          $ref: '#/components/responses/FileBlocked'
        '503':
          $ref: '#/components/responses/FileDependencyUnavailable'
  /v1/chats/{chat_id}/attachments/{file_id}:
    get:
      tags: [Public files]
      operationId: getFile
      summary: 查询文件状态
      description: |
        返回当前文件的安全公共投影。公共响应包含 chatId，不包含内部
        sessionId、OBS URL、Bucket、Endpoint 或凭据。
      security:
        - CallerId: []
          BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 当前文件资源
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResourceResponse'
              examples:
                ready:
                  $ref: '#/components/examples/ReadyFileResponse'
                deleted:
                  $ref: '#/components/examples/DeletedFileResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PublicFileNotFound'
        '503':
          $ref: '#/components/responses/FileDependencyUnavailable'
    delete:
      tags: [Public files]
      operationId: deleteFile
      summary: 异步删除未引用文件
      description: |
        未引用文件进入 DELETING。OBS 删除成功或 NotFound 后删除活动明细并
        留下永久 DELETED tombstone。已引用文件返回 FILE_REFERENCED。
        对 DELETING 或 DELETED 重复调用保持幂等。
      security:
        - CallerId: []
          BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '202':
          description: 删除已登记或此前已登记
          headers:
            Location:
              $ref: '#/components/headers/FileLocation'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResourceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PublicFileNotFound'
        '409':
          $ref: '#/components/responses/FileReferenced'
        '503':
          $ref: '#/components/responses/FileDependencyUnavailable'
  /internal/v1/files:resolve:
    post:
      tags: [Internal runtime]
      operationId: resolveFiles
      summary: 为 Runtime Session 原子解析有序文件集合
      description: |
        只允许 CampusClaw 服务身份调用。JWT 模式使用 X-HW-ID +
        Authorization，APPKEY 模式使用 X-HW-ID + X-HW-APPKEY；两组凭据
        二选一，混用返回 AUTH_CREDENTIAL_CONFLICT，验证失败不得降级。

        在一个短事务内校验全部 fileIds 属于 sessionId、状态 READY、未删除且
        未过期，然后保留首次 referenced_at 并清空 expires_at。任一项失败
        整体回滚。响应 files 严格保持请求顺序。
      security:
        - CallerId: []
          BearerJwt: []
        - CallerId: []
          AppKey: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveFilesRequest'
            examples:
              oneFile:
                value:
                  sessionId: session_01JY8X2E3R4T5Y6U7I8O9P0A1B
                  fileIds:
                    - file_01JY8X2E3R4T5Y6U7I8O9P0A1S
      responses:
        '200':
          description: 全部文件已解析并原子建立首次引用
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveFilesResponse'
              examples:
                resolved:
                  value:
                    resCode: '0'
                    resMsg: success
                    result:
                      sessionId: session_01JY8X2E3R4T5Y6U7I8O9P0A1B
                      files:
                        - fileId: file_01JY8X2E3R4T5Y6U7I8O9P0A1S
                          filename: orders.pdf
                          mediaType: application/pdf
                          sizeBytes: 182734
                          sha256: 3b6f75a86ac2f94c6b20252a66f4d71a7b37b1f48e325ef1698025c813b31c5f
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvalidFile'
        '409':
          $ref: '#/components/responses/FileNotReady'
        '503':
          $ref: '#/components/responses/FileDependencyUnavailable'
  /internal/v1/sessions/{session_id}/files/{file_id}/content:
    get:
      tags: [Internal runtime]
      operationId: streamFileContent
      summary: 向 CampusClaw 流式代理不可变文件正文
      description: |
        只读取 READY 且 referenced_at 非空的文件。mate-service 校验 Session
        归属和期望 SHA-256 后，按 file_id 从 OBS 流式代理正文。二进制成功
        响应不使用 ResultBean。
      security:
        - CallerId: []
          BearerJwt: []
        - CallerId: []
          AppKey: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/ExpectedFileSha256'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: 文件原始字节流，不使用 ResultBean
          headers:
            Content-Length:
              description: openGauss 账本中的可信实际字节数
              required: true
              schema:
                type: integer
                format: int64
                minimum: 1
                maximum: 20971520
            X-File-SHA256:
              description: 与 resolve 快照相同的原始内容 SHA-256
              required: true
              schema:
                $ref: '#/components/schemas/Sha256'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvalidFile'
        '409':
          $ref: '#/components/responses/FileContentMismatch'
        '503':
          $ref: '#/components/responses/FileDependencyUnavailable'
components:
  securitySchemes:
    CallerId:
      type: apiKey
      in: header
      name: X-HW-ID
      description: 公司调用方身份 Header；必须与一种凭据 Header 同时出现。
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 首选公司 JWT 凭据。验证 claim、签名、issuer 和 audience。
    AppKey:
      type: apiKey
      in: header
      name: X-HW-APPKEY
      description: 仅内部 operation 兼容的公司 APPKEY/私钥凭据。
  parameters:
    ChatId:
      name: chat_id
      in: path
      required: true
      description: mate-service 管理的业务 Chat ID。
      schema:
        $ref: '#/components/schemas/ChatId'
    SessionId:
      name: session_id
      in: path
      required: true
      description: 仅供内部 Runtime API 使用的 CampusClaw Session ID。
      schema:
        $ref: '#/components/schemas/SessionId'
    FileId:
      name: file_id
      in: path
      required: true
      description: 文件服务签发的大小写敏感不透明 ID。
      schema:
        $ref: '#/components/schemas/FileId'
    FileSize:
      name: X-File-Size
      in: header
      required: true
      description: file part 的准确字节数，不是 multipart HTTP Body 长度。
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 20971520
    Prefer:
      name: Prefer
      in: header
      required: false
      description: 仅接受 respond-async 或 wait=N；服务端等待上限为 10 秒。
      schema:
        type: string
        maxLength: 16
        pattern: '^(respond-async|wait=(0|[1-9][0-9]{0,9}))$'
    ExpectedFileSha256:
      name: X-Expected-File-SHA256
      in: header
      required: true
      description: resolve 或持久化 Entry 快照中的原始内容 SHA-256。
      schema:
        $ref: '#/components/schemas/Sha256'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 错误消息期望语言；至少支持 zh-CN 与 en-US。
      schema:
        type: string
        maxLength: 128
  headers:
    FileLocation:
      description: 当前文件状态资源的绝对或相对 URL
      required: true
      schema:
        type: string
        format: uri-reference
      example: /mate-service/v1/chats/chat_01JY8X2E3R4T5Y6U7I8O9P0A1C/attachments/file_01JY8X2E3R4T5Y6U7I8O9P0A1S
    RetryAfter:
      description: 建议再次查询状态前等待的秒数
      schema:
        type: integer
        minimum: 1
        maximum: 60
      example: 2
    ContentLanguage:
      description: resMsg 实际使用的语言
      required: true
      schema:
        type: string
        enum: [zh-CN, en-US]
  responses:
    InvalidRequest:
      description: 请求结构、Header、multipart 或实际长度无效
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            zhCN:
              value:
                resCode: INVALID_REQUEST
                resMsg: 请求参数无效。
            enUS:
              value:
                resCode: INVALID_REQUEST
                resMsg: The request is invalid.
    Unauthenticated:
      description: 凭据缺失、无效或 JWT/APPKEY 混用
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                resCode: UNAUTHENTICATED
                resMsg: Authentication is required.
            credentialConflict:
              value:
                resCode: AUTH_CREDENTIAL_CONFLICT
                resMsg: JWT and APPKEY credentials cannot be used together.
    Forbidden:
      description: 已认证身份无权调用
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: FORBIDDEN
            resMsg: The caller is not allowed to perform this operation.
    ChatNotFound:
      description: Chat 不存在、不可见或没有有效 Session 映射
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: CHAT_NOT_FOUND
            resMsg: The chat was not found.
    PublicFileNotFound:
      description: Chat 或文件不可见的非泄露响应
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            chatNotFound:
              value:
                resCode: CHAT_NOT_FOUND
                resMsg: The chat was not found.
            invalidFile:
              value:
                resCode: INVALID_FILE
                resMsg: The file is not available for this chat.
    InvalidFile:
      description: 文件不存在、跨 Session、过期、删除或不可用
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: INVALID_FILE
            resMsg: The file is not available for this session.
    FileTooLarge:
      description: 声明或实际大小超过 20 MiB
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: FILE_TOO_LARGE
            resMsg: The file exceeds the 20 MiB limit.
    FileBlocked:
      description: 安全扫描拒绝该文件
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Location:
          $ref: '#/components/headers/FileLocation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: FILE_BLOCKED
            resMsg: The file was rejected by the content security policy.
    FileReferenced:
      description: 文件已经进入 Session Entry，不能单独删除
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: FILE_REFERENCED
            resMsg: Delete the chat to remove a referenced file.
    FileNotReady:
      description: 已授权文件仍在上传或处理
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: FILE_NOT_READY
            resMsg: The file is still being processed.
    FileContentMismatch:
      description: 期望 SHA-256 与权威账本不一致
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: FILE_CONTENT_MISMATCH
            resMsg: The requested content digest does not match the file.
    FileDependencyUnavailable:
      description: openGauss、OBS 或处理依赖暂时不可用
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            resCode: FILE_STORAGE_UNAVAILABLE
            resMsg: File storage is temporarily unavailable.
  schemas:
    ChatId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      examples: [chat_01JY8X2E3R4T5Y6U7I8O9P0A1C]
    SessionId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      examples: [session_01JY8X2E3R4T5Y6U7I8O9P0A1B]
    FileId:
      type: string
      minLength: 31
      maxLength: 31
      pattern: '^file_[0-9A-Za-z]{26}$'
      description: 大小写敏感；删除后永久不得复用。
      examples: [file_01JY8X2E3R4T5Y6U7I8O9P0A1S]
    FileStatus:
      type: string
      enum: [UPLOADING, PROCESSING, READY, BLOCKED, FAILED, DELETING, DELETED]
    Sha256:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
    DisplayFilename:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^[^\x00-\x1F\x7F/\\]+$'
    MediaType:
      type: string
      minLength: 3
      maxLength: 127
      pattern: '^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$'
    FileResource:
      type: object
      additionalProperties: false
      required: [fileId, chatId, status, createdAt]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
        chatId:
          $ref: '#/components/schemas/ChatId'
        status:
          $ref: '#/components/schemas/FileStatus'
        filename:
          $ref: '#/components/schemas/DisplayFilename'
        mediaType:
          $ref: '#/components/schemas/MediaType'
        expectedSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
        sha256:
          $ref: '#/components/schemas/Sha256'
        referencedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        errorCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
    FileResourceResponse:
      type: object
      additionalProperties: false
      required: [resCode, resMsg, result]
      properties:
        resCode:
          type: string
          const: '0'
        resMsg:
          type: string
          minLength: 1
          maxLength: 512
        result:
          $ref: '#/components/schemas/FileResource'
    ResolveFilesRequest:
      type: object
      additionalProperties: false
      required: [sessionId, fileIds]
      properties:
        sessionId:
          $ref: '#/components/schemas/SessionId'
        fileIds:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FileId'
    ResolvedFile:
      type: object
      additionalProperties: false
      required: [fileId, filename, mediaType, sizeBytes, sha256]
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
        filename:
          $ref: '#/components/schemas/DisplayFilename'
        mediaType:
          $ref: '#/components/schemas/MediaType'
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
        sha256:
          $ref: '#/components/schemas/Sha256'
    ResolvedFilesResult:
      type: object
      additionalProperties: false
      required: [sessionId, files]
      properties:
        sessionId:
          $ref: '#/components/schemas/SessionId'
        files:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ResolvedFile'
    ResolveFilesResponse:
      type: object
      additionalProperties: false
      required: [resCode, resMsg, result]
      properties:
        resCode:
          type: string
          const: '0'
        resMsg:
          type: string
          minLength: 1
          maxLength: 512
        result:
          $ref: '#/components/schemas/ResolvedFilesResult'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [resCode, resMsg]
      properties:
        resCode:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHENTICATED
            - AUTH_CREDENTIAL_CONFLICT
            - FORBIDDEN
            - CHAT_NOT_FOUND
            - INVALID_FILE
            - FILE_TOO_LARGE
            - FILE_SIZE_MISMATCH
            - FILE_NOT_READY
            - FILE_BLOCKED
            - FILE_REFERENCED
            - FILE_CONTENT_MISMATCH
            - FILE_STORAGE_UNAVAILABLE
        resMsg:
          type: string
          minLength: 1
          maxLength: 512
  examples:
    ProcessingFileResponse:
      value:
        resCode: '0'
        resMsg: success
        result:
          fileId: file_01JY8X2E3R4T5Y6U7I8O9P0A1S
          chatId: chat_01JY8X2E3R4T5Y6U7I8O9P0A1C
          status: PROCESSING
          filename: orders.pdf

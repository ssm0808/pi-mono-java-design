  <script>
    (() => {
      const root = document.getElementById('company-api-review-post-agents-agent-id-sessions-fb65ca69');
      const model = JSON.parse(root.querySelector('[data-review-model]').textContent);
      const api = model.api;
      const operation = model.operation;
      const review = model.review || { questions: [] };
      const shell = root.querySelector('[data-api-shell]');
      const make = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      };
      const append = (parent, ...children) => {
        children.filter(Boolean).forEach((child) => parent.appendChild(child));
        return parent;
      };
      const code = (text, className) => make('code', className || '', text);
      const pretty = (value) => typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      const fullPath = `${api.basePath.replace(/\/$/, '')}/${operation.path.replace(/^\//, '')}`;

      const topbar = make('header', 'topbar');
      const titleRow = make('div', 'row');
      append(titleRow, make('h2', '', api.title), make('span', 'tag', api.version));
      if (api.visibility) titleRow.appendChild(make('span', 'tag', api.visibility));
      append(topbar, titleRow, code(api.basePath, 'base'));

      const methodClass = operation.method.toLowerCase();
      const decisionGate = review.decisionGate;
      const gateClass = decisionGate && decisionGate.hideOperationDetails ? ' gate-only' : '';
      const article = make('article', `operation operation-${methodClass}${gateClass}`);
      const operationHead = make('header', 'operation-head');
      append(operationHead,
        make('span', `method method-${methodClass}`, operation.method.toUpperCase()),
        code(operation.path, 'path'),
        make('span', 'muted', operation.summary));
      article.appendChild(operationHead);

      const purpose = make('section', 'section');
      append(purpose, make('h3', '', '作用'), make('p', 'description', operation.description));
      article.appendChild(purpose);

      if (decisionGate) {
        const gateSection = make('section', 'section decision-gate');
        append(gateSection,
          make('h3', '', decisionGate.title),
          make('p', 'description', decisionGate.description));
        const comparison = decisionGate.comparison;
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        comparison.columns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        comparison.rows.forEach((items) => {
          const row = make('tr', '');
          items.forEach((item, index) => {
            const cell = make('td', '', item);
            cell.dataset.label = comparison.columns[index] || '';
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        append(table, head, body);
        wrap.appendChild(table);
        append(gateSection, wrap, make('p', 'decision-notice', decisionGate.detailNotice));
        article.appendChild(gateSection);
      }

      const authModes = operation.authModes || [];
      if (authModes.length) {
        const authSection = make('section', 'section contract-detail');
        const authTitle = make('div', 'row section-title');
        const authTabs = make('div', 'tabs');
        const authBody = make('div', '');
        append(authTitle, make('h3', '', '认证'), authTabs);
        append(authSection, authTitle, authBody);
        article.appendChild(authSection);
        let selectedAuth = authModes.find((item) => item.preferred) || authModes[0];
        const renderAuth = () => {
          authTabs.querySelectorAll('button').forEach((button) => {
            button.setAttribute('aria-pressed', String(button.dataset.authId === selectedAuth.id));
          });
          authBody.replaceChildren();
          const wrap = make('div', 'table-wrap');
          const table = make('table', '');
          const head = make('thead', '');
          const headRow = make('tr', '');
          const authColumns = ['Header', '必填', '示例值', '说明'];
          authColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
          head.appendChild(headRow);
          const body = make('tbody', '');
          selectedAuth.headers.forEach((header) => {
            const row = make('tr', '');
            const cells = [
              append(make('td', ''), code(header.name)),
              make('td', '', header.required ? '是' : '否'),
              append(make('td', ''), code(header.value)),
              make('td', '', header.description)
            ];
            cells.forEach((cell, index) => { cell.dataset.label = authColumns[index]; });
            append(row, ...cells);
            body.appendChild(row);
          });
          append(table, head, body);
          wrap.appendChild(table);
          const request = [
            `${operation.method.toUpperCase()} ${fullPath}`,
            ...selectedAuth.headers.map((header) => `${header.name}: ${header.value}`)
          ].join('\n');
          append(authBody, wrap, append(make('pre', ''), code(request)));
        };
        authModes.forEach((mode) => {
          const button = make('button', '', mode.label);
          button.type = 'button';
          button.dataset.authId = mode.id;
          button.setAttribute('aria-pressed', String(mode.id === selectedAuth.id));
          button.addEventListener('click', () => {
            selectedAuth = mode;
            renderAuth();
          });
          authTabs.appendChild(button);
        });
        renderAuth();
      }

      const requestSection = make('section', 'section contract-detail');
      requestSection.appendChild(make('h3', '', '参数与请求体'));
      const parameters = operation.parameters || [];
      if (parameters.length) {
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        const parameterColumns = ['位置', '名称', '必填', '约束', '说明'];
        parameterColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        parameters.forEach((parameter) => {
          const row = make('tr', '');
          const cells = [
            make('td', '', parameter.in),
            append(make('td', ''), code(parameter.name)),

      append(operationHead,
        make('span', `method method-${methodClass}`, operation.method.toUpperCase()),
        code(operation.path, 'path'),
        make('span', 'muted', operation.summary));
      article.appendChild(operationHead);

      const purpose = make('section', 'section');
      append(purpose, make('h3', '', '作用'), make('p', 'description', operation.description));
      article.appendChild(purpose);

      if (decisionGate) {
        const gateSection = make('section', 'section decision-gate');
        append(gateSection,
          make('h3', '', decisionGate.title),
          make('p', 'description', decisionGate.description));
        const comparison = decisionGate.comparison;
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        comparison.columns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        comparison.rows.forEach((items) => {
          const row = make('tr', '');
          items.forEach((item, index) => {
            const cell = make('td', '', item);
            cell.dataset.label = comparison.columns[index] || '';
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        append(table, head, body);
        wrap.appendChild(table);
        append(gateSection, wrap, make('p', 'decision-notice', decisionGate.detailNotice));
        article.appendChild(gateSection);
      }

      const authModes = operation.authModes || [];
      if (authModes.length) {
        const authSection = make('section', 'section contract-detail');
        const authTitle = make('div', 'row section-title');
        const authTabs = make('div', 'tabs');
        const authBody = make('div', '');
        append(authTitle, make('h3', '', '认证'), authTabs);
        append(authSection, authTitle, authBody);
        article.appendChild(authSection);
        let selectedAuth = authModes.find((item) => item.preferred) || authModes[0];
        const renderAuth = () => {
          authTabs.querySelectorAll('button').forEach((button) => {
            button.setAttribute('aria-pressed', String(button.dataset.authId === selectedAuth.id));
          });
          authBody.replaceChildren();
          const wrap = make('div', 'table-wrap');
          const table = make('table', '');
          const head = make('thead', '');
          const headRow = make('tr', '');
          const authColumns = ['Header', '必填', '示例值', '说明'];
          authColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
          head.appendChild(headRow);
          const body = make('tbody', '');
          selectedAuth.headers.forEach((header) => {
            const row = make('tr', '');
            const cells = [
              append(make('td', ''), code(header.name)),
              make('td', '', header.required ? '是' : '否'),
              append(make('td', ''), code(header.value)),
              make('td', '', header.description)
            ];
            cells.forEach((cell, index) => { cell.dataset.label = authColumns[index]; });
            append(row, ...cells);
            body.appendChild(row);
          });
          append(table, head, body);
          wrap.appendChild(table);
          const request = [
            `${operation.method.toUpperCase()} ${fullPath}`,
            ...selectedAuth.headers.map((header) => `${header.name}: ${header.value}`)
          ].join('\n');
          append(authBody, wrap, append(make('pre', ''), code(request)));
        };
        authModes.forEach((mode) => {
          const button = make('button', '', mode.label);
          button.type = 'button';
          button.dataset.authId = mode.id;
          button.setAttribute('aria-pressed', String(mode.id === selectedAuth.id));
          button.addEventListener('click', () => {
            selectedAuth = mode;
            renderAuth();
          });
          authTabs.appendChild(button);
        });
        renderAuth();
      }

      const requestSection = make('section', 'section contract-detail');
      requestSection.appendChild(make('h3', '', '参数与请求体'));
      const parameters = operation.parameters || [];
      if (parameters.length) {
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        const parameterColumns = ['位置', '名称', '必填', '约束', '说明'];
        parameterColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        parameters.forEach((parameter) => {
          const row = make('tr', '');
          const cells = [
            make('td', '', parameter.in),
            append(make('td', ''), code(parameter.name)),
            make('td', '', parameter.required ? '是' : '否'),
            append(make('td', ''), code(parameter.schema || '—')),
            make('td', '', parameter.description)
          ];
          cells.forEach((cell, index) => { cell.dataset.label = parameterColumns[index]; });
          append(row, ...cells);
          body.appendChild(row);
        });
        append(table, head, body);
        wrap.appendChild(table);
        requestSection.appendChild(wrap);
      } else {
        requestSection.appendChild(make('p', 'muted empty', '无 path/query/header 业务参数。'));
      }
      const requestBody = operation.requestBody || {};
      requestSection.appendChild(make('p', 'muted empty', requestBody.description || '无请求体。'));
      if (requestBody.example !== undefined && requestBody.example !== null) {
        requestSection.appendChild(append(make('pre', ''), code(pretty(requestBody.example))));
      }
      article.appendChild(requestSection);

      const responseSection = make('section', 'section contract-detail');
      const responseTitle = make('div', 'row section-title');
      const localeTabs = make('div', 'tabs');
      append(responseTitle, make('h3', '', '响应'), localeTabs);
      const statusTabs = make('div', 'tabs');
      const responseBody = make('div', '');
      append(responseSection, responseTitle, statusTabs, responseBody);
      article.appendChild(responseSection);
      const responses = operation.responses;
      const responseIdentity = (response) => response.id || response.status;
      let selectedResponse = responses[0];
      let selectedLocale = Object.keys(selectedResponse.bodies || {})[0] || 'default';
      const renderResponse = () => {
        statusTabs.querySelectorAll('button').forEach((button) => {
          button.setAttribute('aria-selected', String(button.dataset.responseId === responseIdentity(selectedResponse)));
        });
        const locales = Object.keys(selectedResponse.bodies || {});
        if (!locales.includes(selectedLocale)) selectedLocale = locales[0] || 'default';
        localeTabs.replaceChildren();
        locales.forEach((locale) => {
          const button = make('button', '', locale);
          button.type = 'button';
          button.setAttribute('aria-pressed', String(locale === selectedLocale));
          button.addEventListener('click', () => {
            selectedLocale = locale;
            renderResponse();
          });
          localeTabs.appendChild(button);
        });
        responseBody.replaceChildren();
        responseBody.appendChild(make('p', 'description', `${selectedResponse.status} ${selectedResponse.label} — ${selectedResponse.summary}`));
        const responseHeaders = { ...(selectedResponse.headers || {}) };
        if (selectedLocale !== 'default' && Object.hasOwn(responseHeaders, 'Content-Language')) {
          responseHeaders['Content-Language'] = selectedLocale;
        }
        const headerLines = Object.entries(responseHeaders).map(([name, value]) => `${name}: ${value}`);
        const payload = selectedResponse.bodies ? selectedResponse.bodies[selectedLocale] : null;
        const output = [...headerLines, headerLines.length ? '' : null, payload === undefined ? null : pretty(payload)]
          .filter((item) => item !== null).join('\n');
        responseBody.appendChild(append(make('pre', ''), code(output)));
      };
      responses.forEach((response) => {
        const button = make('button', '', response.tabLabel || response.status);
        button.type = 'button';
        button.dataset.responseId = responseIdentity(response);
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(response === selectedResponse));
        button.addEventListener('click', () => {
          selectedResponse = response;
          renderResponse();
        });
        statusTabs.appendChild(button);
      });
      renderResponse();

      append(shell, topbar, article);

      const questions = review.questions || [];
      if (questions.length) {
        const form = make('form', 'review-form');
        form.appendChild(make('h3', '', '继续调整'));
        const questionGrid = make('div', 'question-grid');
        if (questions.length === 1) questionGrid.classList.add('question-grid-single');
        questions.forEach((question) => {
          const fieldset = make('fieldset', '');
          fieldset.appendChild(make('legend', '', question.legend));
          question.options.forEach((option, index) => {
            const label = make('label', '');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = question.id;
            input.value = option.value;
            input.checked = option.selected || (!question.options.some((item) => item.selected) && index === 0);
            const optionCopy = make('span', 'option-copy');
            append(optionCopy,
              make('span', 'option-label', option.label),
              make('span', 'option-detail', option.value));
            append(label, input, optionCopy);
            fieldset.appendChild(label);
          });
          questionGrid.appendChild(fieldset);
        });
        form.appendChild(questionGrid);
        const actions = make('div', 'actions');
        const submit = make('button', 'submit', '提交调整意见');
        submit.type = 'submit';
        const formStatus = make('span', 'muted', '');
        formStatus.setAttribute('role', 'status');
        formStatus.setAttribute('aria-live', 'polite');
        append(actions, submit, formStatus);
        form.appendChild(actions);
        const promptOutput = make('pre', 'prompt-output', '');
        promptOutput.hidden = true;
        form.appendChild(promptOutput);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const data = new FormData(form);
          const selections = questions.map((question) => `- ${question.legend}：${data.get(question.id)}`).join('\n');
          const promptSuffix = review.promptSuffix || '请按这些选择更新主维护契约、设计文档和当前接口展示。';
          const prompt = `${review.promptPrefix}\n${selections}\n${promptSuffix}`;
          if (!window.openai || typeof window.openai.sendFollowUpMessage !== 'function') {
            promptOutput.textContent = prompt;
            promptOutput.hidden = false;
            try {
              await navigator.clipboard.writeText(prompt);
              formStatus.textContent = '调整提示已复制，请粘贴到对话中。';
            } catch (error) {
              formStatus.textContent = '请复制下方调整提示并发送到对话中。';
            }
            return;
          }
          formStatus.textContent = '正在提交…';
          try {
            await window.openai.sendFollowUpMessage({ prompt, title: review.followUpTitle });
            formStatus.textContent = '已提交。';
          } catch (error) {
            formStatus.textContent = '提交失败，请重试。';
          }
        });
        shell.appendChild(form);
      }
    })();
  </script>
</div>

  <script>
    (() => {
      const root = document.getElementById('company-api-review-delete-sessions-session-id-9c3da2a0');
      const model = JSON.parse(root.querySelector('[data-review-model]').textContent);
      const api = model.api;
      const operation = model.operation;
      const review = model.review || { questions: [] };
      const shell = root.querySelector('[data-api-shell]');
      const make = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      };
      const append = (parent, ...children) => {
        children.filter(Boolean).forEach((child) => parent.appendChild(child));
        return parent;
      };
      const code = (text, className) => make('code', className || '', text);
      const pretty = (value) => typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      const fullPath = `${api.basePath.replace(/\/$/, '')}/${operation.path.replace(/^\//, '')}`;

      const topbar = make('header', 'topbar');
      const titleRow = make('div', 'row');
      append(titleRow, make('h2', '', api.title), make('span', 'tag', api.version));
      if (api.visibility) titleRow.appendChild(make('span', 'tag', api.visibility));
      append(topbar, titleRow, code(api.basePath, 'base'));

      const methodClass = operation.method.toLowerCase();
      const decisionGate = review.decisionGate;
      const gateClass = decisionGate && decisionGate.hideOperationDetails ? ' gate-only' : '';
      const article = make('article', `operation operation-${methodClass}${gateClass}`);
      const operationHead = make('header', 'operation-head');
      append(operationHead,
        make('span', `method method-${methodClass}`, operation.method.toUpperCase()),
        code(operation.path, 'path'),
        make('span', 'muted', operation.summary));
      article.appendChild(operationHead);

      const purpose = make('section', 'section');
      append(purpose, make('h3', '', '作用'), make('p', 'description', operation.description));
      article.appendChild(purpose);

      if (decisionGate) {
        const gateSection = make('section', 'section decision-gate');
        append(gateSection,
          make('h3', '', decisionGate.title),
          make('p', 'description', decisionGate.description));
        const comparison = decisionGate.comparison;
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        comparison.columns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        comparison.rows.forEach((items) => {
          const row = make('tr', '');
          items.forEach((item, index) => {
            const cell = make('td', '', item);
            cell.dataset.label = comparison.columns[index] || '';
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        append(table, head, body);
        wrap.appendChild(table);
        append(gateSection, wrap, make('p', 'decision-notice', decisionGate.detailNotice));
        article.appendChild(gateSection);
      }

      const authModes = operation.authModes || [];
      if (authModes.length) {
        const authSection = make('section', 'section contract-detail');
        const authTitle = make('div', 'row section-title');
        const authTabs = make('div', 'tabs');
        const authBody = make('div', '');
        append(authTitle, make('h3', '', '认证'), authTabs);
        append(authSection, authTitle, authBody);
        article.appendChild(authSection);
        let selectedAuth = authModes.find((item) => item.preferred) || authModes[0];
        const renderAuth = () => {
          authTabs.querySelectorAll('button').forEach((button) => {
            button.setAttribute('aria-pressed', String(button.dataset.authId === selectedAuth.id));
          });
          authBody.replaceChildren();
          const wrap = make('div', 'table-wrap');
          const table = make('table', '');
          const head = make('thead', '');
          const headRow = make('tr', '');
          const authColumns = ['Header', '必填', '示例值', '说明'];
          authColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
          head.appendChild(headRow);
          const body = make('tbody', '');
          selectedAuth.headers.forEach((header) => {
            const row = make('tr', '');
            const cells = [
              append(make('td', ''), code(header.name)),
              make('td', '', header.required ? '是' : '否'),
              append(make('td', ''), code(header.value)),
              make('td', '', header.description)
            ];
            cells.forEach((cell, index) => { cell.dataset.label = authColumns[index]; });
            append(row, ...cells);
            body.appendChild(row);
          });
          append(table, head, body);
          wrap.appendChild(table);
          const request = [
            `${operation.method.toUpperCase()} ${fullPath}`,
            ...selectedAuth.headers.map((header) => `${header.name}: ${header.value}`)
          ].join('\n');
          append(authBody, wrap, append(make('pre', ''), code(request)));
        };
        authModes.forEach((mode) => {
          const button = make('button', '', mode.label);
          button.type = 'button';
          button.dataset.authId = mode.id;
          button.setAttribute('aria-pressed', String(mode.id === selectedAuth.id));
          button.addEventListener('click', () => {
            selectedAuth = mode;
            renderAuth();
          });
          authTabs.appendChild(button);
        });
        renderAuth();
      }

      const requestSection = make('section', 'section contract-detail');
      requestSection.appendChild(make('h3', '', '参数与请求体'));
      const parameters = operation.parameters || [];
      if (parameters.length) {
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        const parameterColumns = ['位置', '名称', '必填', '约束', '说明'];
        parameterColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        parameters.forEach((parameter) => {
          const row = make('tr', '');
          const cells = [
            make('td', '', parameter.in),
            append(make('td', ''), code(parameter.name)),
            make('td', '', parameter.required ? '是' : '否'),
            append(make('td', ''), code(parameter.schema || '—')),
            make('td', '', parameter.description)
          ];
          cells.forEach((cell, index) => { cell.dataset.label = parameterColumns[index]; });
          append(row, ...cells);
          body.appendChild(row);
        });
        append(table, head, body);
        wrap.appendChild(table);
        requestSection.appendChild(wrap);
      } else {
        requestSection.appendChild(make('p', 'muted empty', '无 path/query/header 业务参数。'));
      }
      const requestBody = operation.requestBody || {};
      requestSection.appendChild(make('p', 'muted empty', requestBody.description || '无请求体。'));
      if (requestBody.example !== undefined && requestBody.example !== null) {
        requestSection.appendChild(append(make('pre', ''), code(pretty(requestBody.example))));
      }
      article.appendChild(requestSection);

      const responseSection = make('section', 'section contract-detail');
      const responseTitle = make('div', 'row section-title');
      const localeTabs = make('div', 'tabs');
      append(responseTitle, make('h3', '', '响应'), localeTabs);
      const statusTabs = make('div', 'tabs');
      const responseBody = make('div', '');
      append(responseSection, responseTitle, statusTabs, responseBody);
      article.appendChild(responseSection);
      const responses = operation.responses;
      const responseIdentity = (response) => response.id || response.status;
      let selectedResponse = responses[0];
      let selectedLocale = Object.keys(selectedResponse.bodies || {})[0] || 'default';
      const renderResponse = () => {
        statusTabs.querySelectorAll('button').forEach((button) => {
          button.setAttribute('aria-selected', String(button.dataset.responseId === responseIdentity(selectedResponse)));
        });
        const locales = Object.keys(selectedResponse.bodies || {});
        if (!locales.includes(selectedLocale)) selectedLocale = locales[0] || 'default';
        localeTabs.replaceChildren();
        locales.forEach((locale) => {
          const button = make('button', '', locale);
          button.type = 'button';
          button.setAttribute('aria-pressed', String(locale === selectedLocale));
          button.addEventListener('click', () => {
            selectedLocale = locale;
            renderResponse();
          });
          localeTabs.appendChild(button);
        });
        responseBody.replaceChildren();
        responseBody.appendChild(make('p', 'description', `${selectedResponse.status} ${selectedResponse.label} — ${selectedResponse.summary}`));
        const responseHeaders = { ...(selectedResponse.headers || {}) };
        if (selectedLocale !== 'default' && Object.hasOwn(responseHeaders, 'Content-Language')) {
          responseHeaders['Content-Language'] = selectedLocale;
        }
        const headerLines = Object.entries(responseHeaders).map(([name, value]) => `${name}: ${value}`);
        const payload = selectedResponse.bodies ? selectedResponse.bodies[selectedLocale] : null;
        const output = [...headerLines, headerLines.length ? '' : null, payload === undefined ? null : pretty(payload)]
          .filter((item) => item !== null).join('\n');
        responseBody.appendChild(append(make('pre', ''), code(output)));
      };
      responses.forEach((response) => {
        const button = make('button', '', response.tabLabel || response.status);
        button.type = 'button';
        button.dataset.responseId = responseIdentity(response);
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(response === selectedResponse));
        button.addEventListener('click', () => {
          selectedResponse = response;
          renderResponse();
        });
        statusTabs.appendChild(button);
      });
      renderResponse();

      append(shell, topbar, article);

      const questions = review.questions || [];
      if (questions.length) {
        const form = make('form', 'review-form');
        form.appendChild(make('h3', '', '继续调整'));
        const questionGrid = make('div', 'question-grid');
        if (questions.length === 1) questionGrid.classList.add('question-grid-single');
        questions.forEach((question) => {
          const fieldset = make('fieldset', '');
          fieldset.appendChild(make('legend', '', question.legend));
          question.options.forEach((option, index) => {
            const label = make('label', '');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = question.id;
            input.value = option.value;
            input.checked = option.selected || (!question.options.some((item) => item.selected) && index === 0);
            const optionCopy = make('span', 'option-copy');
            append(optionCopy,
              make('span', 'option-label', option.label),
              make('span', 'option-detail', option.value));
            append(label, input, optionCopy);
            fieldset.appendChild(label);
          });
          questionGrid.appendChild(fieldset);
        });
        form.appendChild(questionGrid);
        const actions = make('div', 'actions');
        const submit = make('button', 'submit', '提交调整意见');
        submit.type = 'submit';
        const formStatus = make('span', 'muted', '');
        formStatus.setAttribute('role', 'status');
        formStatus.setAttribute('aria-live', 'polite');
        append(actions, submit, formStatus);
        form.appendChild(actions);
        const promptOutput = make('pre', 'prompt-output', '');
        promptOutput.hidden = true;
        form.appendChild(promptOutput);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const data = new FormData(form);
          const selections = questions.map((question) => `- ${question.legend}：${data.get(question.id)}`).join('\n');
          const promptSuffix = review.promptSuffix || '请按这些选择更新主维护契约、设计文档和当前接口展示。';
          const prompt = `${review.promptPrefix}\n${selections}\n${promptSuffix}`;
          if (!window.openai || typeof window.openai.sendFollowUpMessage !== 'function') {
            promptOutput.textContent = prompt;
            promptOutput.hidden = false;
            try {
              await navigator.clipboard.writeText(prompt);
              formStatus.textContent = '调整提示已复制，请粘贴到对话中。';
            } catch (error) {
              formStatus.textContent = '请复制下方调整提示并发送到对话中。';
            }
            return;
          }
          formStatus.textContent = '正在提交…';
          try {
            await window.openai.sendFollowUpMessage({ prompt, title: review.followUpTitle });
            formStatus.textContent = '已提交。';
          } catch (error) {
            formStatus.textContent = '提交失败，请重试。';
          }
        });
        shell.appendChild(form);
      }
    })();
  </script>

  <script type="application/json" data-review-model>{"api":{"title":"CampusClaw Service API","version":"1.17.0-proposal","basePath":"/campusclaw-service/v1","visibility":"Internal · 评审中（成功事件序列已确认）"},"operation":{"method":"POST","path":"/sessions/{session_id}/events","summary":"提交用户消息并流式返回 Session 执行事件","description":"向既有 Session 提交一个 user.message，持久化用户 MessageEntry，并在同一个 HTTP POST 响应中以 SSE 推送完整成功事件序列。公共契约不创建 run_id；一次用户消息可触发多次模型调用、工具调用和多条 Assistant MessageEntry。已确认 user.message、Assistant 消息三阶段、tool.execution.started/completed、持久化 tool.result、session.status.idle 和 stream.end。网络断开不取消执行，调用方不得自动重放 POST，应通过 History 恢复权威 Entry。","authModes":[{"id":"jwt","label":"JWT 首选","preferred":true,"headers":[{"name":"X-HW-ID","value":"\u003cCALLER_ID\u003e","required":true,"description":"公司调用方标识"},{"name":"Authorization","value":"Bearer \u003cJWT\u003e","required":true,"description":"公司 JWT"}]},{"id":"appkey","label":"APPKEY 兼容","preferred":false,"headers":[{"name":"X-HW-ID","value":"\u003cCALLER_ID\u003e","required":true,"description":"公司调用方标识"},{"name":"X-HW-APPKEY","value":"\u003cAPPKEY\u003e","required":true,"description":"公司 APPKEY 凭据"}]}],"parameters":[{"in":"path","name":"session_id","required":true,"schema":"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$","description":"已经存在且未删除的 Session 标识；区分大小写"},{"in":"header","name":"Accept-Language","required":false,"schema":"zh-CN | en-US","description":"流建立前 JSON 异常和流内异常消息语言；缺失或不支持时回退 en-US"}],"requestBody":{"required":true,"contentType":"application/json","description":"请求 type 固定为 user.message；message 和 file_ids 至少提供一项。message 提供时必须包含非空白字符并保留原始值；file_ids 是由文件服务签发、绑定当前 Session 的不透明标识，最多 32 个、不可重复并保留顺序。不接收 model_id、thinking、metadata、instructions、tool choice、timeout、priority、URL、MIME、文件名、Base64、client_request_id 或 Idempotency-Key。","example":{"type":"user.message","message":"请分析这些订单文件，并列出异常项。","file_ids":["file_01JY8X2E3R4T5Y6U7I8O9P0A1S"]}},"responses":[{"status":"200","label":"OK","summary":"用户消息已持久化并开始返回 SSE。成功流不使用 ResultBean；user.message、assistant.message.completed 和 tool.result 是带 entry_seq 的权威 Entry，工具执行事件是实时进度，session.status.idle 后以 stream.end 正常关闭本次流。","headers":{"Content-Type":"text/event-stream","Cache-Control":"no-store","Content-Language":"en-US"},"bodies":{"default":"id: 17\nevent: user.message\ndata: {\"entry_id\":\"entry_100\",\"entry_seq\":17}\n\nevent: assistant.message.started\ndata: {\"entry_id\":\"entry_101\",\"role\":\"assistant\"}\n\nevent: assistant.message.delta\ndata: {\"entry_id\":\"entry_101\",\"delta\":{\"type\":\"text\",\"text\":\"我先查询异常订单。\"}}\n\nid: 18\nevent: assistant.message.completed\ndata: {\"entry_id\":\"entry_101\",\"entry_seq\":18,\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"text\",\"text\":\"我先查询异常订单。\"},{\"type\":\"tool_call\",\"tool_call_id\":\"call_201\",\"name\":\"query_abnormal_orders\",\"arguments\":{\"scope\":\"uploaded_files\"}}]},\"finish_reason\":\"tool_call\"}\n\nevent: tool.execution.started\ndata: {\"tool_call_id\":\"call_201\",\"tool_name\":\"query_abnormal_orders\"}\n\nevent: tool.execution.completed\ndata: {\"tool_call_id\":\"call_201\",\"tool_name\":\"query_abnormal_orders\",\"is_error\":false}\n\nid: 19\nevent: tool.result\ndata: {\"entry_id\":\"entry_102\",\"entry_seq\":19,\"tool_call_id\":\"call_201\",\"tool_name\":\"query_abnormal_orders\",\"content\":[{\"type\":\"text\",\"text\":\"发现 3 条异常订单。\"}],\"is_error\":false}\n\nevent: assistant.message.started\ndata: {\"entry_id\":\"entry_103\",\"role\":\"assistant\"}\n\nevent: assistant.message.delta\ndata: {\"entry_id\":\"entry_103\",\"delta\":{\"type\":\"text\",\"text\":\"发现 3 条异常订单。\"}}\n\nid: 20\nevent: assistant.message.completed\ndata: {\"entry_id\":\"entry_103\",\"entry_seq\":20,\"message\":{\"role\":\"assistant\",\"content\":[{\"type\":\"text\",\"text\":\"发现 3 条异常订单。\"}]},\"finish_reason\":\"stop\"}\n\nevent: session.status.idle\ndata: {\"status\":\"idle\"}\n\nevent: stream.end\ndata: {\"reason\":\"completed\"}\n"}},{"id":"400-invalid-session-id","status":"400","tabLabel":"400 · INVALID_SESSION_ID","label":"Bad Request","summary":"流建立前发现 session_id 不符合标识格式；异常 JSON 只有 resCode 和 resMsg。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"INVALID_SESSION_ID","resMsg":"session_id 格式不正确。"},"en-US":{"resCode":"INVALID_SESSION_ID","resMsg":"The session_id format is invalid."}}},{"id":"400-invalid-event-request","status":"400","tabLabel":"400 · INVALID_EVENT_REQUEST","label":"Bad Request","summary":"请求体不是合法的 user.message，包含未知字段，或 message/file_ids 约束不满足。错误码名称仍待本接口整体确认。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"INVALID_EVENT_REQUEST","resMsg":"用户事件请求内容不符合约束。"},"en-US":{"resCode":"INVALID_EVENT_REQUEST","resMsg":"The user event request does not satisfy the required constraints."}}},{"id":"401-unauthenticated","status":"401","tabLabel":"401 · UNAUTHENTICATED","label":"Unauthorized","summary":"凭据缺失、不完整、格式错误或所选凭据校验失败。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"UNAUTHENTICATED","resMsg":"调用方身份认证失败。"},"en-US":{"resCode":"UNAUTHENTICATED","resMsg":"Caller authentication failed."}}},{"id":"401-auth-credential-conflict","status":"401","tabLabel":"401 · AUTH_CREDENTIAL_CONFLICT","label":"Unauthorized","summary":"请求同时携带 Authorization 和 X-HW-APPKEY，两套身份语义冲突。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"AUTH_CREDENTIAL_CONFLICT","resMsg":"请求不能同时携带 JWT 和 APPKEY 凭据。"},"en-US":{"resCode":"AUTH_CREDENTIAL_CONFLICT","resMsg":"JWT and APPKEY credentials must not be supplied together."}}},{"status":"403","label":"Forbidden","summary":"调用方已认证，但无权向该 Session 提交用户事件。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"FORBIDDEN","resMsg":"当前调用方无权向该 Session 提交用户事件。"},"en-US":{"resCode":"FORBIDDEN","resMsg":"The caller is not allowed to submit an event to this Session."}}},{"status":"404","label":"Not Found","summary":"Session 不存在或已删除。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"SESSION_NOT_FOUND","resMsg":"指定的 Session 不存在。"},"en-US":{"resCode":"SESSION_NOT_FOUND","resMsg":"The specified Session does not exist."}}},{"status":"409","label":"Conflict","summary":"Session 正在处理另一个用户事件；当前提案不排队接受第二个 user.message。错误码名称仍待本接口整体确认。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"SESSION_BUSY","resMsg":"该 Session 正在处理另一条用户消息。"},"en-US":{"resCode":"SESSION_BUSY","resMsg":"The Session is processing another user message."}}},{"id":"500-before-stream","status":"500","tabLabel":"500 · 流建立前","label":"Internal Server Error","summary":"用户 MessageEntry 未能持久化，且 SSE 响应尚未开始；返回普通 JSON 异常。错误码名称仍待本接口整体确认。","headers":{"Content-Type":"application/json","Content-Language":"zh-CN"},"bodies":{"zh-CN":{"resCode":"EVENT_ACCEPTANCE_FAILED","resMsg":"用户事件接收失败。"},"en-US":{"resCode":"EVENT_ACCEPTANCE_FAILED","resMsg":"User event acceptance failed."}}},{"id":"200-stream-error","status":"200","tabLabel":"200 · 流内异常","label":"SSE already started","summary":"SSE 响应开始后发生执行异常，HTTP status 已不能改变；发送 stream.error，随后关闭流。该事件名称与错误分层仍待后续确认。","headers":{"Content-Type":"text/event-stream","Cache-Control":"no-store","Content-Language":"zh-CN"},"bodies":{"default":"event: stream.error\ndata: {\"resCode\":\"SESSION_EXECUTION_FAILED\",\"resMsg\":\"Session 执行失败。\"}\n"}}]},"review":{"questions":[{"id":"stream_error_event","legend":"下一步：流建立后的执行异常如何表达","options":[{"label":"stream.error 后关闭（推荐）","value":"以 stream.error 返回 resCode 和本地化 resMsg，随后关闭当前 SSE","selected":true},{"label":"assistant completed 表达","value":"用 finish_reason=error 的最终 Assistant MessageEntry 表达执行失败","selected":false},{"label":"两者同时返回","value":"先持久化错误 Assistant MessageEntry，再发送 stream.error 并关闭流","selected":false}]}],"followUpTitle":"继续对齐流内异常","promptPrefix":"继续调整 POST /campusclaw-service/v1/sessions/{session_id}/events 的流内异常契约","promptSuffix":"完整成功事件序列已经确认，请保持不变；请区分流建立前 JSON 错误与流建立后 SSE 错误。"}}</script>
  <script>
    (() => {
      const root = document.getElementById('company-api-review-post-sessions-session-id-events-db6cd0d3');
      const model = JSON.parse(root.querySelector('[data-review-model]').textContent);
      const api = model.api;
      const operation = model.operation;
      const review = model.review || { questions: [] };
      const shell = root.querySelector('[data-api-shell]');
      const make = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      };
      const append = (parent, ...children) => {
        children.filter(Boolean).forEach((child) => parent.appendChild(child));
        return parent;
      };
      const code = (text, className) => make('code', className || '', text);
      const pretty = (value) => typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      const fullPath = `${api.basePath.replace(/\/$/, '')}/${operation.path.replace(/^\//, '')}`;

      const topbar = make('header', 'topbar');
      const titleRow = make('div', 'row');
      append(titleRow, make('h2', '', api.title), make('span', 'tag', api.version));
      if (api.visibility) titleRow.appendChild(make('span', 'tag', api.visibility));
      append(topbar, titleRow, code(api.basePath, 'base'));

      const methodClass = operation.method.toLowerCase();
      const decisionGate = review.decisionGate;
      const gateClass = decisionGate && decisionGate.hideOperationDetails ? ' gate-only' : '';
      const article = make('article', `operation operation-${methodClass}${gateClass}`);
      const operationHead = make('header', 'operation-head');
      append(operationHead,
        make('span', `method method-${methodClass}`, operation.method.toUpperCase()),
        code(operation.path, 'path'),
        make('span', 'muted', operation.summary));
      article.appendChild(operationHead);

      const purpose = make('section', 'section');
      append(purpose, make('h3', '', '作用'), make('p', 'description', operation.description));
      article.appendChild(purpose);

      if (decisionGate) {
        const gateSection = make('section', 'section decision-gate');
        append(gateSection,
          make('h3', '', decisionGate.title),
          make('p', 'description', decisionGate.description));
        const comparison = decisionGate.comparison;
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        comparison.columns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        comparison.rows.forEach((items) => {
          const row = make('tr', '');
          items.forEach((item, index) => {
            const cell = make('td', '', item);
            cell.dataset.label = comparison.columns[index] || '';
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
        append(table, head, body);
        wrap.appendChild(table);
        append(gateSection, wrap, make('p', 'decision-notice', decisionGate.detailNotice));
        article.appendChild(gateSection);
      }

      const authModes = operation.authModes || [];
      if (authModes.length) {
        const authSection = make('section', 'section contract-detail');
        const authTitle = make('div', 'row section-title');
        const authTabs = make('div', 'tabs');
        const authBody = make('div', '');
        append(authTitle, make('h3', '', '认证'), authTabs);
        append(authSection, authTitle, authBody);
        article.appendChild(authSection);
        let selectedAuth = authModes.find((item) => item.preferred) || authModes[0];
        const renderAuth = () => {
          authTabs.querySelectorAll('button').forEach((button) => {
            button.setAttribute('aria-pressed', String(button.dataset.authId === selectedAuth.id));
          });
          authBody.replaceChildren();
          const wrap = make('div', 'table-wrap');
          const table = make('table', '');
          const head = make('thead', '');
          const headRow = make('tr', '');
          const authColumns = ['Header', '必填', '示例值', '说明'];
          authColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
          head.appendChild(headRow);
          const body = make('tbody', '');
          selectedAuth.headers.forEach((header) => {
            const row = make('tr', '');
            const cells = [
              append(make('td', ''), code(header.name)),
              make('td', '', header.required ? '是' : '否'),
              append(make('td', ''), code(header.value)),
              make('td', '', header.description)
            ];
            cells.forEach((cell, index) => { cell.dataset.label = authColumns[index]; });
            append(row, ...cells);
            body.appendChild(row);
          });
          append(table, head, body);
          wrap.appendChild(table);
          const request = [
            `${operation.method.toUpperCase()} ${fullPath}`,
            ...selectedAuth.headers.map((header) => `${header.name}: ${header.value}`)
          ].join('\n');
          append(authBody, wrap, append(make('pre', ''), code(request)));
        };
        authModes.forEach((mode) => {
          const button = make('button', '', mode.label);
          button.type = 'button';
          button.dataset.authId = mode.id;
          button.setAttribute('aria-pressed', String(mode.id === selectedAuth.id));
          button.addEventListener('click', () => {
            selectedAuth = mode;
            renderAuth();
          });
          authTabs.appendChild(button);
        });
        renderAuth();
      }

      const requestSection = make('section', 'section contract-detail');
      requestSection.appendChild(make('h3', '', '参数与请求体'));
      const parameters = operation.parameters || [];
      if (parameters.length) {
        const wrap = make('div', 'table-wrap');
        const table = make('table', '');
        const head = make('thead', '');
        const headRow = make('tr', '');
        const parameterColumns = ['位置', '名称', '必填', '约束', '说明'];
        parameterColumns.forEach((item) => headRow.appendChild(make('th', '', item)));
        head.appendChild(headRow);
        const body = make('tbody', '');
        parameters.forEach((parameter) => {
          const row = make('tr', '');
          const cells = [
            make('td', '', parameter.in),
            append(make('td', ''), code(parameter.name)),
            make('td', '', parameter.required ? '是' : '否'),
            append(make('td', ''), code(parameter.schema || '—')),
            make('td', '', parameter.description)
          ];
          cells.forEach((cell, index) => { cell.dataset.label = parameterColumns[index]; });
          append(row, ...cells);
          body.appendChild(row);
        });
        append(table, head, body);
        wrap.appendChild(table);
        requestSection.appendChild(wrap);
      } else {
        requestSection.appendChild(make('p', 'muted empty', '无 path/query/header 业务参数。'));
      }
      const requestBody = operation.requestBody || {};
      requestSection.appendChild(make('p', 'muted empty', requestBody.description || '无请求体。'));
      if (requestBody.example !== undefined && requestBody.example !== null) {
        requestSection.appendChild(append(make('pre', ''), code(pretty(requestBody.example))));
      }
      article.appendChild(requestSection);

      const responseSection = make('section', 'section contract-detail');
      const responseTitle = make('div', 'row section-title');
      const localeTabs = make('div', 'tabs');
      append(responseTitle, make('h3', '', '响应'), localeTabs);
      const statusTabs = make('div', 'tabs');
      const responseBody = make('div', '');
      append(responseSection, responseTitle, statusTabs, responseBody);
      article.appendChild(responseSection);
      const responses = operation.responses;
      const responseIdentity = (response) => response.id || response.status;
      let selectedResponse = responses[0];
      let selectedLocale = Object.keys(selectedResponse.bodies || {})[0] || 'default';
      const renderResponse = () => {
        statusTabs.querySelectorAll('button').forEach((button) => {
          button.setAttribute('aria-selected', String(button.dataset.responseId === responseIdentity(selectedResponse)));
        });
        const locales = Object.keys(selectedResponse.bodies || {});
        if (!locales.includes(selectedLocale)) selectedLocale = locales[0] || 'default';
        localeTabs.replaceChildren();
        locales.forEach((locale) => {
          const button = make('button', '', locale);
          button.type = 'button';
          button.setAttribute('aria-pressed', String(locale === selectedLocale));
          button.addEventListener('click', () => {
            selectedLocale = locale;
            renderResponse();
          });
          localeTabs.appendChild(button);
        });
        responseBody.replaceChildren();
        responseBody.appendChild(make('p', 'description', `${selectedResponse.status} ${selectedResponse.label} — ${selectedResponse.summary}`));
        const responseHeaders = { ...(selectedResponse.headers || {}) };
        if (selectedLocale !== 'default' && Object.hasOwn(responseHeaders, 'Content-Language')) {
          responseHeaders['Content-Language'] = selectedLocale;
        }
        const headerLines = Object.entries(responseHeaders).map(([name, value]) => `${name}: ${value}`);
        const payload = selectedResponse.bodies ? selectedResponse.bodies[selectedLocale] : null;
        const output = [...headerLines, headerLines.length ? '' : null, payload === undefined ? null : pretty(payload)]
          .filter((item) => item !== null).join('\n');
        responseBody.appendChild(append(make('pre', ''), code(output)));
      };
      responses.forEach((response) => {
        const button = make('button', '', response.tabLabel || response.status);
        button.type = 'button';
        button.dataset.responseId = responseIdentity(response);
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(response === selectedResponse));
        button.addEventListener('click', () => {
          selectedResponse = response;
          renderResponse();
        });
        statusTabs.appendChild(button);
      });
      renderResponse();

      append(shell, topbar, article);

      const questions = review.questions || [];
      if (questions.length) {
        const form = make('form', 'review-form');
        form.appendChild(make('h3', '', '继续调整'));
        const questionGrid = make('div', 'question-grid');
        if (questions.length === 1) questionGrid.classList.add('question-grid-single');
        questions.forEach((question) => {
          const fieldset = make('fieldset', '');
          fieldset.appendChild(make('legend', '', question.legend));
          question.options.forEach((option, index) => {
            const label = make('label', '');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = question.id;
            input.value = option.value;
            input.checked = option.selected || (!question.options.some((item) => item.selected) && index === 0);
            const optionCopy = make('span', 'option-copy');
            append(optionCopy,
              make('span', 'option-label', option.label),
              make('span', 'option-detail', option.value));
            append(label, input, optionCopy);
            fieldset.appendChild(label);
          });
          questionGrid.appendChild(fieldset);
        });
        form.appendChild(questionGrid);
        const actions = make('div', 'actions');
        const submit = make('button', 'submit', '提交调整意见');
        submit.type = 'submit';
        const formStatus = make('span', 'muted', '');
        formStatus.setAttribute('role', 'status');
        formStatus.setAttribute('aria-live', 'polite');
        append(actions, submit, formStatus);
        form.appendChild(actions);
        const promptOutput = make('pre', 'prompt-output', '');
        promptOutput.hidden = true;
        form.appendChild(promptOutput);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const data = new FormData(form);
          const selections = questions.map((question) => `- ${question.legend}：${data.get(question.id)}`).join('\n');
          const promptSuffix = review.promptSuffix || '请按这些选择更新主维护契约、设计文档和当前接口展示。';
          const prompt = `${review.promptPrefix}\n${selections}\n${promptSuffix}`;
          if (!window.openai || typeof window.openai.sendFollowUpMessage !== 'function') {
            promptOutput.textContent = prompt;
            promptOutput.hidden = false;
            try {
              await navigator.clipboard.writeText(prompt);
              formStatus.textContent = '调整提示已复制，请粘贴到对话中。';
            } catch (error) {
              formStatus.textContent = '请复制下方调整提示并发送到对话中。';
            }
            return;
          }
          formStatus.textContent = '正在提交…';
          try {
            await window.openai.sendFollowUpMessage({ prompt, title: review.followUpTitle });
            formStatus.textContent = '已提交。';
          } catch (error) {
            formStatus.textContent = '提交失败，请重试。';
          }
        });
        shell.appendChild(form);
      }
    })();
  </script>
</div>

  </main>
</body>
</html>

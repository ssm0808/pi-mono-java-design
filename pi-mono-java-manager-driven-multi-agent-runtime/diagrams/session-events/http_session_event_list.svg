="301.2886"/><text fill="#0F172A" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="178.7578" x="17" y="322.5445">GET /sessions/{sessionId}/events</text></g><!--entity Recovery--><g class="entity" data-qualified-name="Recovery" data-source-line="166" id="ent0004"><rect fill="#F8FAFC" height="33.7988" rx="2.5" ry="2.5" style="stroke:#475569;stroke-width:0.5;" width="157.3965" x="533.68" y="183.6886"/><text fill="#0F172A" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="137.3965" x="543.68" y="204.9445">Model recovery projection</text></g><!--entity Context--><g class="entity" data-qualified-name="Context" data-source-line="167" id="ent0005"><rect fill="#F8FAFC" height="33.7988" rx="2.5" ry="2.5" style="stroke:#475569;stroke-width:0.5;" width="186.1133" x="519.32" y="301.2886"/><text fill="#0F172A" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="166.1133" x="529.32" y="322.5445">ManagedAgentSession context</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="176" id="ent0011"><path d="M214.48,181.7886 L214.48,196.5886 L180.11,200.5886 L214.48,204.5886 L214.48,219.3863 A0,0 0 0 0 214.48,219.3863 L498.2788,219.3863 A0,0 0 0 0 498.2788,219.3863 L498.2788,191.7886 L488.2788,181.7886 L214.48,181.7886 A0,0 0 0 0 214.48,181.7886" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M488.2788,181.7886 L488.2788,191.7886 L498.2788,191.7886 L488.2788,181.7886" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="254.1387" x="220.48" y="198.0445">Started, delta, failed, idle, end, and stream error</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="262.7988" x="220.48" y="211.8433">events are transient and never enter GET history.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="181" id="ent0014"><path d="M725.79,174.8886
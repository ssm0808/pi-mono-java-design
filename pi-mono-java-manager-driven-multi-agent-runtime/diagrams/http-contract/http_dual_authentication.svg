gthAdjust="spacing" textLength="120.7007" x="378.5815" y="187.1387">bind operation inputs</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159.707" x="378.5815" y="202.0874">without credential validation</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="97" id="msg3"><polygon fill="#475569" points="574.354,244.791,584.354,248.791,574.354,252.791,578.354,248.791" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#475569;stroke-width:1;" x1="371.5815" x2="580.354" y1="248.791" y2="248.791"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="103.3525" x="378.5815" y="244.0361">execute operation</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" data-source-line="98" id="msg4"><polygon fill="#475569" points="382.5815,273.7397,372.5815,277.7397,382.5815,281.7397,378.5815,277.7397" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2,2;" x1="376.5815" x2="585.354" y1="277.7397" y2="277.7397"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.7725" x="388.5815" y="272.9849">operation result or SSE publisher</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="99" id="msg5"><polygon fill="#475569" points="86.2036,302.6885,76.2036,306.6885,86.2036,310.6885,82.2036,306.6885" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#475569;stroke-width:1;stroke-dasharray:2,2;" x1="80.2036" x2="370.5815" y1="306.6885" y2="306.6885"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272.3779" x="92.2036" y="301.9336">normal HTTP, SSE, or business error response</text></g><path d="M5,319.6885 L5,373.6885 L442,373.6885 L442,329.6885 L432,319.6885 L5,319.6885" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M432,319.6885 L432,329.6885 L442,329.6885 L432,319.6885" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="375.7559" x="11" y="336.8823">Upstream verifies credential authenticity and action authorization.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="416.2222" x="11" y="351.8311">Runtime does not check completeness, mutual exclusion, Bearer shape,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="362.7368" x="11" y="366.7798">or whether Authorization and X-HW-APPKEY are both present.</text><path d="M279,384.5347 L279,483.5347 L677,483.5347 L677,394.5347 L667,384.5347 L279,384.5347" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M667,384.5347 L667,394.5347 L677,394.5347 L667,384.5347" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.7915" x="285" y="401.7285">Header names are case-insensitive under HTTP.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="330.9795" x="285" y="416.6772">Their standard and company spellings remain unchanged</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="324.4604" x="285" y="431.626">when path and payload fields move to lowerCamelCase.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="320.8804" x="285" y="446.5747">Credential values remain opaque and are never logged,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="377.9395" x="285" y="461.5234">persisted, copied into ResultBean, or used as Session ownership.</text><text fill="#000000" 
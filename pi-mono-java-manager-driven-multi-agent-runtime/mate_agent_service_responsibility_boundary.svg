<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="522px" preserveAspectRatio="none" style="width:1872px;height:522px;background:#FFFFFF;" version="1.1" viewBox="0 0 1872 522" width="1872px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="210"><text fill="#0F172A" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="341.5029" x="762.0238" y="23.1318">End-to-End HTTP and SSE Service Responsibilities</text></g><!--entity UI--><g class="entity" data-qualified-name="UI" data-source-line="241" id="ent0001"><rect fill="#EFF6FF" height="132.6904" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="198.999" x="7" y="254.1986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="54.4756" x="17" y="277.3305">Agent UI</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="17" y="293.4291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="174.2959" x="17" y="309.5277">Call public HTTP operations</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="103.5029" x="17" y="325.6264">Use chat_id only</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.999" x="17" y="341.725">Read execution-scoped SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.9648" x="17" y="357.8236">Close on stream end or error</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="17" y="373.9223">Never receive session_id</text></g><!--entity Mate--><g class="entity" data-qualified-name="Mate" data-source-line="243" id="ent0002"><rect fill="#FFF7ED" height="164.8877" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="256.5234" x="522.68" y="238.0986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80.1309" x="532.68" y="261.2305">mate-service</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="532.68" y="277.3291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="168.8477" x="532.68" y="293.4277">Own public HTTP and SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="159.5576" x="532.68" y="309.5264">Authenticate the end user</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.792" x="532.68" y="325.625">Own Chat metadata and chat_id</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="161.875" x="532.68" y="341.7236">Map chat_id to session_id</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="203.1162" x="532.68" y="357.8223">Run guardrails and orchestration</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="236.5234" x="532.68" y="373.9209">Call CampusClaw with service identity</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="227.2266" x="532.68" y="390.0195">Project safe public events and errors</text></g><!--entity Runtime--><g class="entity" data-qualified-name="Runtime" data-source-line="245" id="ent0003"><rect fill="#ECFDF5" height="164.8877" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="311.0811" x="1131.5" y="44.0986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="83.248" x="1141.5" y="67.2305">CampusClaw</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1141.5" y="83.3291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.1855" x="1141.5" y="99.4277">Own internal HTTP and SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="252.9365" x="1141.5" y="115.5264">Validate service credential header shape</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="235.792" x="1141.5" y="131.625">Own Runtime Session and session_id</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="160.3369" x="1141.5" y="147.7236">Validate Agent and Model</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="291.0811" x="1141.5" y="163.8223">Build Context and execute Model and read tool</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="185.1787" x="1141.5" y="179.9209">Persist current-branch Entries</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.7578" x="1141.5" y="196.0195">Own Steer, FollowUp, and Abort</text></g><!--entity MateStore--><g class="entity" data-qualified-name="MateStore" data-source-line="247" id="ent0004"><path d="M1186.77,358.7986 C1186.77,348.7986 1287.0488,348.7986 1287.0488,348.7986 C1287.0488,348.7986 1387.3276,348.7986 1387.3276,358.7986 L1387.3276,448.2918 C1387.3276,458.2918 1287.0488,458.2918 1287.0488,458.2918 C1287.0488,458.2918 1186.77,458.2918 1186.77,448.2918 L1186.77,358.7986" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1186.77,358.7986 C1186.77,368.7986 1287.0488,368.7986 1287.0488,368.7986 C1287.0488,368.7986 1387.3276,368.7986 1387.3276,358.7986" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="101.9375" x="1196.77" y="385.9305">Mate Chat Store</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1196.77" y="402.0291">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="130.751" x="1196.77" y="418.1277">chat_id to session_id</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="180.5576" x="1196.77" y="434.2264">Chat name and product state</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="97.2617" x="1196.77" y="450.325">User ownership</text></g><!--entity RuntimeStore--><g class="entity" data-qualified-name="RuntimeStore" data-source-line="249" id="ent0005"><path d="M1632.2,81.7986 C1632.2,71.7986 1739.8753,71.7986 1739.8753,71.7986 C1739.8753,71.7986 1847.5506,71.7986 1847.5506,81.7986 L1847.5506,171.2918 C1847.5506,181.2918 1739.8753,181.2918 1739.8753,181.2918 C1739.8753,181.2918 1632.2,181.2918 1632.2,171.2918 L1632.2,81.7986" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1632.2,81.7986 C1632.2,91.7986 1739.8753,91.7986 1739.8753,91.7986 C1739.8753,91.7986 1847.5506,91.7986 1847.5506,81.7986" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="135.3994" x="1642.2" y="108.9305">RuntimeSessionStore</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1642.2" y="125.0291">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="195.3506" x="1642.2" y="141.1277">Session state and configuration</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="141.6133" x="1642.2" y="157.2264">Current-branch Entries</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="144.7578" x="1642.2" y="173.325">Internal execution state</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="257" id="ent0011"><path d="M458,446.6486 L458,498.4436 A9,9 0 0 0 467,507.4436 L834.8887,507.4436 A9,9 0 0 0 843.8887,498.4436 L843.8887,447.6486 L833.8887,437.6486 L654.94,437.6486 L650.94,403.0286 L646.94,437.6486 L467,437.6486 A9,9 0 0 0 458,446.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M833.8887,437.6486 L833.8887,443.1486 A4.5,4.5 0 0 0 838.3887,447.6486 L843.8887,447.6486 L833.8887,437.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="320.8804" x="464" y="454.8425">The public and internal hops are independent contracts.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="364.8887" x="464" y="469.7912">mate-service does not forward the internal stream byte for byte.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.8823" x="464" y="484.7399">Public paths, VOs, errors, and event projection require</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="240.6396" x="464" y="499.6887">a separate operation-by-operation review.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="264" id="ent0014"><path d="M1095.89,252.6486 L1095.89,304.4436 A9,9 0 0 0 1104.89,313.4436 L1469.2049,313.4436 A9,9 0 0 0 1478.2049,304.4436 L1478.2049,253.6486 L1468.2049,243.6486 L1291.05,243.6486 L1287.05,209.0286 L1283.05,243.6486 L1104.89,243.6486 A9,9 0 0 0 1095.89,252.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1468.2049,243.6486 L1468.2049,249.1486 A4.5,4.5 0 0 0 1472.7049,253.6486 L1478.2049,253.6486 L1468.2049,243.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="358.4268" x="1101.89" y="260.8425">Each user-message POST owns one bounded SSE response.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="1101.89" y="275.7912">Steer and FollowUp are separate HTTP requests that enqueue</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="326.6123" x="1101.89" y="290.7399">into the active execution. Abort is another HTTP request.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="321.5723" x="1101.89" y="305.6887">The Runtime does not read chat_id or end-user identity.</text></g><!--link UI to Mate--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="251" id="lnk6"><path d="M211.36,320.5386 C300.13,320.5386 420.97,320.5386 517.56,320.5386" fill="none" id="UI-Mate" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="206.36,320.5386,215.36,324.5386,211.36,320.5386,215.36,316.5386,206.36,320.5386" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#64748B" points="522.56,320.5386,513.56,316.5386,517.56,320.5386,513.56,324.5386,522.56,320.5386" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="124.9917" x="269.5349" y="287.7325">public HTTP requests</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.0615" x="237" y="302.6812">ResultBean, 204, or scoped SSE</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="80.2217" x="291.9199" y="317.6299">chat_id scope</text></g><!--link Mate to Runtime--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="252" id="lnk7"><path d="M784.2812,280.0558 C885.7312,249.0158 1018.4887,208.4013 1126.4587,175.3713" fill="none" id="Mate-Runtim
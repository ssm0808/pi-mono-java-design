apshot</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" data-source-line="232" id="msg10"><polygon fill="#181818" points="850.1729,562.7656,840.1729,566.7656,850.1729,570.7656,846.1729,566.7656" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="844.1729" x2="1176.749" y1="566.7656" y2="566.7656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274.374" x="871.2739" y="528.8359">Recheck task, generation, grant and slot</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="314.5762" x="851.1729" y="545.3242">Commit Session + first message + root + Run</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.5596" x="925.6812" y="561.8125">or a known rejected Run</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" data-source-line="233" id="msg11"><polygon fill="#181818" points="1165.749,593.2539,1175.749,597.2539,1165.749,601.2539,1169.749,597.2539" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="839.1729" x2="1171.749" y1="597.2539" y2="597.2539"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.6289" x="910.1465" y="592.3008">Durable acceptance outcome</text></g><g class="message" data-entity-1="part5" data-entity-2="part2" data-source-line="234" id="msg12"><polygon fill="#181818" points="360.6646,623.7422,350.6646,627.7422,360.6646,631.7422,356.6646,627.7422" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="354.6646" x2="1176.749" y1="627.7422" y2="627.7422"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" t
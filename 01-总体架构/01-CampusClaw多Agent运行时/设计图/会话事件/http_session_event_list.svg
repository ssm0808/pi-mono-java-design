="315.0886"/><text fill="#0F172A" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="178.7578" x="17" y="336.3445">GET /sessions/{sessionId}/events</text></g><!--entity Recovery--><g class="entity" data-qualified-name="Recovery" data-source-line="171" id="ent0004"><rect fill="#F8FAFC" height="33.7988" rx="2.5" ry="2.5" style="stroke:#475569;stroke-width:0.5;" width="157.3965" x="533.68" y="190.5886"/><text fill="#0F172A" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="137.3965" x="543.68" y="211.8445">Model recovery projection</text></g><!--entity Context--><g class="entity" data-qualified-name="Context" data-source-line="172" id="ent0005"><rect fill="#F8FAFC" height="33.7988" rx="2.5" ry="2.5" style="stroke:#475569;stroke-width:0.5;" width="186.1133" x="519.32" y="315.0886"/><text fill="#0F172A" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="166.1133" x="529.32" y="336.3445">ManagedAgentSession context</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="181" id="ent0011"><path d="M214.48,188.6886 L214.48,203.4886 L180.11,207.4886 L214.48,211.4886 L214.48,226.2863 A0,0 0 0 0 214.48,226.2863 L498.2788,226.2863 A0,0 0 0 0 498.2788,226.2863 L498.2788,198.6886 L488.2788,188.6886 L214.48,188.6886 A0,0 0 0 0 214.48,188.6886" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M488.2788,188.6886 L488.2788,198.6886 L498.2788,198.6886 L488.2788,188.6886" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="254.1387" x="220.48" y="204.9445">Started, delta, failed, idle, end, and stream error</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="262.7988" x="220.48" y="218.7433">events are transient and never enter GET history.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="186" id="ent0014"><path d="M725.78,174.8986 L725.78,203.4886 L691.31,207.4886 L725.78,211.4886 L725.78,240.0939 A0,0 0 0 0 725.78,240.0939 L1108.9773,240.0939 A0,0 0 0 0 1108.9773,240.0939 L1108.9773,184.8986 L1098.9773,174.8986 L725.78,174.8986 A0,0 0 0 0 725.78,174.8986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1098.9773,174.8986 L1098.9773,184.8986 L1108.9773,184.8986 L1098.9773,174.8986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="231.4805" x="731.78" y="191.1545">Model and thinking changes are audit facts.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="292.7988" x="731.78" y="204.9533">They are not converted to User or Assistant messages.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="306.1758" x="731.78" y="218.7521">Entries hidden behind compaction remain durable history.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="362.1973" x="731.78" y="232.551">Retry candidates remain auditable but never re-enter model context.</text></g><!--link Entries to Public--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="174" id="lnk6"><path d="M317.17,86.2686 C299.5,95.1586 278.81,105.7886 260.38,115.8986 C215.09,140.7186 167.8422,168.9809 137.3522,187.5209" fill="none" id="Entries-to-Public" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="133.08,190.1186,142.8482,188.8604,137.3522,187.5209,138.6917,182.0249,133.08,190.1186" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="254.8008" x="261.38" y="128.1545">messages, ToolResult, model/thinking changes,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="212.1211" x="282.7198" y="141.9533">compaction completed, allowed thinking</text></g><!--link Public to GetEvents--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="175" id="lnk7"><path d="M106.38,224.7586 C106.38,248.1886 106.38,286.1886 106.38,309.6586" fill="none" id="Public-to-GetEvents" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="106.38,314.6586,110.38,305.6586,106.38,309.6586,102.38,305.6586,106.38,314.6586" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="176.1387" x="107.38" y="282.3445">entrySeq order and opaque page</text></g><!--link Entries to Recovery--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="177" id="lnk8"><path d="M452.02,86.2986 C475.28,93.6886 499.54,103.3886 520.38,115.8986 C553.63,135.8486 580.8346,166.3058 596.9946,186.4858" fill="none" id="Entries-to-Recovery" style="stroke:#475569;stroke-width:1;"/><polygon fill="#475569" points="600.12,190.3886,597.6166,180.8632,596.9946,186.4858,591.3721,185.8638,600.12,190.3886" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="254.8066" x="561.1276" y="128.1545">messages and ToolResult after latest boundary,</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="261.4219" x="557.82" y="141.9533">latest summary, minus private discarded Entry ID</text></g><!--link Recovery to Context--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="178" id="lnk9"><path d="M612.38,224.7586 C612.38,248.1886 612.38,286.1886 612.38,309.6586" fill="none" id="Recovery-to-Context" style="stroke:#475569;stroke-width:1;"/
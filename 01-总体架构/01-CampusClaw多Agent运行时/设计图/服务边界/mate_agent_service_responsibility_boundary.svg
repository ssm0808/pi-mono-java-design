<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="533px" preserveAspectRatio="none" style="width:1887px;height:533px;background:#FFFFFF;" version="1.1" viewBox="0 0 1887 533" width="1887px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#0F172A" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="335.2822" x="772.6342" y="23.1318">HTTP Boundaries: Message SSE and Builtin JSON</text></g><!--entity UI--><g class="entity" data-qualified-name="UI" data-source-line="32" id="ent0001"><rect fill="#EFF6FF" height="132.6904" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="198.999" x="7" y="265.1986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="54.4756" x="17" y="288.3305">Agent UI</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="17" y="304.4291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="174.2959" x="17" y="320.5277">Call public HTTP operations</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="96.4961" x="17" y="336.6264">Use chatId only</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.999" x="17" y="352.725">Read execution-scoped SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.9648" x="17" y="368.8236">Close on stream end or error</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="149.3994" x="17" y="384.9223">Never receive sessionId</text></g><!--entity Mate--><g class="entity" data-qualified-name="Mate" data-source-line="34" id="ent0002"><rect fill="#FFF7ED" height="164.8877" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="282.2197" x="514.83" y="249.0986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80.1309" x="524.83" y="272.2305">mate-service</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="524.83" y="288.3291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="168.8477" x="524.83" y="304.4277">Own public HTTP and SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="159.5576" x="524.83" y="320.5264">Authenticate the end user</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="193.7852" x="524.83" y="336.625">Own Chat metadata and chatId</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="256.0127" x="524.83" y="352.7236">Map public Chat ID to internal Session ID</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="203.1162" x="524.83" y="368.8223">Run guardrails and orchestration</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="262.2197" x="524.83" y="384.9209">Call CampusClaw with request credentials</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="227.2266" x="524.83" y="401.0195">Project safe public events and errors</text></g><!--entity Runtime--><g class="entity" data-qualified-name="Runtime" data-source-line="36" id="ent0003"><rect fill="#ECFDF5" height="164.8877" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="330.4951" x="1136.8" y="44.0986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="83.248" x="1146.8" y="67.2305">CampusClaw</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1146.8" y="83.3291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.1855" x="1146.8" y="99.4277">Own internal HTTP and SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="310.4951" x="1146.8" y="115.5264">Receive request context without credential checks</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="228.7852" x="1146.8" y="131.625">Own Runtime Session and sessionId</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="160.3369" x="1146.8" y="147.7236">Validate Agent and Model</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="291.0811" x="1146.8" y="163.8223">Build Context and execute Model and read tool</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="185.1787" x="1146.8" y="179.9209">Persist current-branch Entries</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200.7578" x="1146.8" y="196.0195">Own Steer, FollowUp, and Abort</text></g><!--entity MateStore--><g class="entity" data-qualified-name="MateStore" data-source-line="38" id="ent0004"><path d="M1173.37,373.7986 C1173.37,363.7986 1302.0419,363.7986 1302.0419,363.7986 C1302.0419,363.7986 1430.7138,363.7986 1430.7138,373.7986 L1430.7138,463.2918 C1430.7138,473.2918 1302.0419,473.2918 1302.0419,473.2918 C1302.0419,473.2918 1173.37,473.2918 1173.37,463.2918 L1173.37,373.7986" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1173.37,373.7986 C1173.37,383.7986 1302.0419,383.7986 1302.0419,383.7986 C1302.0419,383.7986 1430.7138,383.7986 1430.7138,373.7986" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="101.9375" x="1183.37" y="400.9305">Mate Chat Store</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1183.37" y="417.0291">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="1183.37" y="433.1277">Public Chat ID to internal Session ID</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="237.3438" x="1183.37" y="449.2264">Product state (no Session name copy)</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="97.2617" x="1183.37" y="465.325">User ownership</text></g><!--entity RuntimeStore--><g class="entity" data-qualified-name="RuntimeStore" data-source-line="40" id="ent0005"><path d="M1647.2,81.7986 C1647.2,71.7986 1754.8753,71.7986 1754.8753,71.7986 C1754.8753,71.7986 1862.5506,71.7986 1862.5506,81.7986 L1862.5506,171.2918 C1862.5506,181.2918 1754.8753,181.2918 1754.8753,181.2918 C1754.8753,181.2918 1647.2,181.2918 1647.2,171.2918 L1647.2,81.7986" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1647.2,81.7986 C1647.2,91.7986 1754.8753,91.7986 1754.8753,91.7986 C1754.8753,91.7986 1862.5506,91.7986 1862.5506,81.7986" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="135.3994" x="1657.2" y="108.9305">RuntimeSessionStore</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1657.2" y="125.0291">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="195.3506" x="1657.2" y="141.1277">Session state and configuration</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="141.6133" x="1657.2" y="157.2264">Current-branch Entries</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="144.7578" x="1657.2" y="173.325">Internal execution state</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="48" id="ent0011"><path d="M463,457.6486 L463,509.4436 A9,9 0 0 0 472,518.4436 L839.8887,518.4436 A9,9 0 0 0 848.8887,509.4436 L848.8887,458.6486 L838.8887,448.6486 L659.94,448.6486 L655.94,414.0286 L651.94,448.6486 L472,448.6486 A9,9 0 0 0 463,457.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M838.8887,448.6486 L838.8887,454.1486 A4.5,4.5 0 0 0 843.3887,458.6486 L848.8887,458.6486 L838.8887,448.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="320.8804" x="469" y="465.8425">The public and internal hops are independent contracts.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="364.8887" x="469" y="480.7912">mate-service does not forward the internal stream byte for byte.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.8823" x="469" y="495.7399">Public paths, VOs, errors, and event projection require</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="240.6396" x="469" y="510.6887">a separate operation-by-operation review.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="55" id="ent0014"><path d="M1110.89,253.1686 L1110.89,319.9123 A9,9 0 0 0 1119.89,328.9123 L1484.2049,328.9123 A9,9 0 0 0 1493.2049,319.9123 L1493.2049,254.1686 L1483.2049,244.1686 L1306.05,244.1686 L1302.05,209.3986 L1298.05,244.1686 L1119.89,244.1686 A9,9 0 0 0 1110.89,253.1686" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1483.2049,244.1686 L1483.2049,249.6686 A4.5,4.5 0 0 0 1487.7049,254.1686 L1493.2049,254.1686 L1483.2049,244.1686" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="358.4268" x="1116.89" y="261.3625">Each user-message POST owns one bounded SSE response.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="360.5278" x="1116.89" y="276.3112">Builtin commands return JSON; Skill work proceeds in parallel.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="361.3149" x="1116.89" y="291.2599">Steer and FollowUp are separate HTTP requests that enqueue</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="326.6123" x="1116.89" y="306.2087">into the active execution. Abort is another HTTP request.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="315.0659" x="1116.89" y="321.1574">The Runtime does not read chatId or end-user identity.</text></g><!--link UI to Mate--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="42" id="lnk6"><path d="M211.32,331.5386 C297.32,331.5386 412.97,331.5386 509.42,331.5386" fill="none" id="UI-Mate" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="206.32,331.5386,215.32,335.5386,211.32,331.5386,215.32,327.5386,206.32,331.5386" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#64748B" points="514.42,331.5386,505.42,327.5386,509.42,331.5386,505.42,335.5386,514.42,331.5386" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="124.9917" x="272.4231" y="283.7325">public HTTP requests</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="181.3589" x="244.2395" y="298.6812">Message JSON or scoped SSE</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="195.8379" x="237" y="313.6299">Public command protocol pending</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="73.7153" x="298.0613" y="328.5787">chatId scope</text></g><!--link Mate to Runtime--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="43" id="lnk7"><path d="M802.2645,285.2923 C902.0245,253.5423 1026.7455,213.845 1131.5355,180.495" fill="none" id="Mate-Runtime" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="797.5,286.8086,807.2892,287.8908,802.2645,285.2923,804.863,280.2675,797.5,286.8086" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#64748B" points="1136.3,178.9786,1126.5108,177.8964,1131.5355,180.495,1128.9369,185.5197,1136.3,178.9786" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="133.6626" x="913.504" y="150.8925">internal HTTP requests</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.8906" x="879.89" y="165.8412">ResultBean, 204, or message SSE</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.4517" x="897.6095" y="180.7899">Builtin command: JSON only</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93.2217" x="933.7245" y="195.7387">sessionId scope</text></g><!--link Mate to MateStore--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="44" id="lnk8"><path d="M797.5,350.5286 C909.38,365.6386 1059.695,385.9392 1168.135,400.5892" fill="none" id="Mate-to-MateStore" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="1173.09,401.2586,1164.7065,396.0897,1168.135,400.5892,1163.6355,404.0177,1173.09,401.2586" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill=
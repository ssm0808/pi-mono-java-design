<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="544px" preserveAspectRatio="none" style="width:1979px;height:544px;background:#FFFFFF;" version="1.1" viewBox="0 0 1979 544" width="1979px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#0F172A" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="335.2822" x="818.4942" y="23.1318">HTTP Boundaries: Message SSE and Builtin JSON</text></g><!--entity UI--><g class="entity" data-qualified-name="UI" data-source-line="32" id="ent0001"><rect fill="#EFF6FF" height="132.6904" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="198.999" x="7" y="276.1986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="54.4756" x="17" y="299.3305">Agent UI</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="17" y="315.4291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="174.2959" x="17" y="331.5277">Call public HTTP operations</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="96.4961" x="17" y="347.6264">Use chatId only</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.999" x="17" y="363.725">Read execution-scoped SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.9648" x="17" y="379.8236">Close on stream end or error</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="149.3994" x="17" y="395.9223">Never receive sessionId</text></g><!--entity Mate--><g class="entity" data-qualified-name="Mate" data-source-line="34" id="ent0002"><rect fill="#FFF7ED" height="164.8877" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="282.2197" x="514.83" y="260.0986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80.1309" x="524.83" y="283.2305">mate-service</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="524.83" y="299.3291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="168.8477" x="524.83" y="315.4277">Own public HTTP and SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="159.5576" x="524.83" y="331.5264">Authenticate the end user</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="193.7852" x="524.83" y="347.625">Own Chat metadata and chatId</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="256.0127" x="524.83" y="363.7236">Map public Chat ID to internal Session ID</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="203.1162" x="524.83" y="379.8223">Run guardrails and orchestration</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="262.2197" x="524.83" y="395.9209">Call CampusClaw with request credentials</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="227.2266" x="524.83" y="412.0195">Project safe public events and errors</text></g><!--entity Runtime--><g class="entity" data-qualified-name="Runtime" data-source-line="36" id="ent0003"><rect fill="#ECFDF5" height="164.8877" rx="9" ry="9" style="stroke:#94A3B8;stroke-width:0.5;" width="349.9912" x="1172.91" y="44.0986"/><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="83.248" x="1182.91" y="67.2305">CampusClaw</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1182.91" y="83.3291">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="178.1855" x="1182.91" y="99.4277">Own internal HTTP and SSE</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="310.4951" x="1182.91" y="115.5264">Receive request context without credential checks</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="228.7852" x="1182.91" y="131.625">Own Runtime Session and sessionId</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="160.3369" x="1182.91" y="147.7236">Validate Agent and Model</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="291.0811" x="1182.91" y="163.8223">Build Context and execute Model and read tool</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="185.1787" x="1182.91" y="179.9209">Persist current-branch Entries</text><text fill="#0F172A" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="329.9912" x="1182.91" y="196.0195">Own Events interruption; no pending message queue</text></g><!--entity MateStore--><g class="entity" data-qualified-name="MateStore" data-source-line="38" id="ent0004"><path d="M1219.23,388.7986 C1219.23,378.7986 1347.9019,378.7986 1347.9019,378.7986 C1347.9019,378.7986 1476.5738,378.7986 1476.5738,388.7986 L1476.5738,478.2918 C1476.5738,488.2918 1347.9019,488.2918 1347.9019,488.2918 C1347.9019,488.2918 1219.23,488.2918 1219.23,478.2918 L1219.23,388.7986" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1219.23,388.7986 C1219.23,398.7986 1347.9019,398.7986 1347.9019,398.7986 C1347.9019,398.7986 1476.5738,398.7986 1476.5738,388.7986" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="101.9375" x="1229.23" y="415.9305">Mate Chat Store</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1229.23" y="432.0291">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="1229.23" y="448.1277">Public Chat ID to internal Session ID</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="237.3438" x="1229.23" y="464.2264">Product state (no Session name copy)</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="97.2617" x="1229.23" y="480.325">User ownership</text></g><!--entity RuntimeStore--><g class="entity" data-qualified-name="RuntimeStore" data-source-line="40" id="ent0005"><path d="M1738.92,81.7986 C1738.92,71.7986 1846.5953,71.7986 1846.5953,71.7986 C1846.5953,71.7986 1954.2706,71.7986 1954.2706,81.7986 L1954.2706,171.2918 C1954.2706,181.2918 1846.5953,181.2918 1846.5953,181.2918 C1846.5953,181.2918 1738.92,181.2918 1738.92,171.2918 L1738.92,81.7986" fill="#F8FAFC" style="stroke:#94A3B8;stroke-width:0.5;"/><path d="M1738.92,81.7986 C1738.92,91.7986 1846.5953,91.7986 1846.5953,91.7986 C1846.5953,91.7986 1954.2706,91.7986 1954.2706,81.7986" fill="none" style="stroke:#94A3B8;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="135.3994" x="1748.92" y="108.9305">RuntimeSessionStore</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="3.8896" x="1748.92" y="125.0291">&#160;</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="195.3506" x="1748.92" y="141.1277">Session state and configuration</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="141.6133" x="1748.92" y="157.2264">Current-branch Entries</text><text fill="#334155" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="144.7578" x="1748.92" y="173.325">Internal execution state</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="48" id="ent0011"><path d="M463,468.6486 L463,520.4436 A9,9 0 0 0 472,529.4436 L839.8887,529.4436 A9,9 0 0 0 848.8887,520.4436 L848.8887,469.6486 L838.8887,459.6486 L659.94,459.6486 L655.94,425.0286 L651.94,459.6486 L472,459.6486 A9,9 0 0 0 463,468.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M838.8887,459.6486 L838.8887,465.1486 A4.5,4.5 0 0 0 843.3887,469.6486 L848.8887,469.6486 L838.8887,459.6486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="320.8804" x="469" y="476.8425">The public and internal hops are independent contracts.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="364.8887" x="469" y="491.7912">mate-service does not forward the internal stream byte for byte.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="312.8823" x="469" y="506.7399">Public paths, VOs, errors, and event projection require</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="240.6396" x="469" y="521.6887">a separate operation-by-operation review.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="55" id="ent0014"><path d="M1110.89,252.6986 L1110.89,334.391 A9,9 0 0 0 1119.89,343.391 L1575.9222,343.391 A9,9 0 0 0 1584.9222,334.391 L1584.9222,253.6986 L1574.9222,243.6986 L1351.9,243.6986 L1347.9,209.0986 L1343.9,243.6986 L1119.89,243.6986 A9,9 0 0 0 1110.89,252.6986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1574.9222,243.6986 L1574.9222,249.1986 A4.5,4.5 0 0 0 1579.4222,253.6986 L1584.9222,253.6986 L1574.9222,243.6986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="358.4268" x="1116.89" y="260.8925">Each user-message POST owns one bounded SSE response.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="453.0322" x="1116.89" y="275.8412">Builtin commands return JSON; shared Skill integration is reviewed separately.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="407.5322" x="1116.89" y="290.7899">Each interrupt or tool confirmation uses a new POST Events response.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="409.0239" x="1116.89" y="305.7387">No standalone control routes. No queued next message in this release.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="303.4688" x="1116.89" y="320.6874">Future FollowUp requires separate activation review.</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="315.0659" x="1116.89" y="335.6361">The Runtime does not read chatId or end-user identity.</text></g><!--link UI to Mate--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="42" id="lnk6"><path d="M211.32,342.5386 C297.32,342.5386 412.97,342.5386 509.42,342.5386" fill="none" id="UI-Mate" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="206.32,342.5386,215.32,346.5386,211.32,342.5386,215.32,338.5386,206.32,342.5386" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#64748B" points="514.42,342.5386,505.42,338.5386,509.42,342.5386,505.42,346.5386,514.42,342.5386" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="124.9917" x="272.4231" y="294.7325">public HTTP requests</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="181.3589" x="244.2395" y="309.6812">Message JSON or scoped SSE</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="195.8379" x="237" y="324.6299">Public command protocol pending</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="73.7153" x="298.0613" y="339.5787">chatId scope</text></g><!--link Mate to Runtime--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="43" id="lnk7"><path d="M802.1717,297.0749 C910.6217,263.1249 1051.7384,218.9425 1167.8784,182.5825" fill="none" id="Mate-Runtime" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="797.4,298.5686,807.184,299.6972,802.1717,297.0749,804.794,292.0625,797.4,298.5686" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#64748B" points="1172.65,181.0886,1162.866,179.9603,1167.8784,182.5825,1165.2562,187.5949,1172.65,181.0886" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="133.6626" x="913.504" y="167.3925">internal HTTP requests</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="200.8906" x="879.89" y="182.3412">ResultBean, 204, or message SSE</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="165.4517" x="897.6095" y="197.2899">Builtin command: JSON only</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93.2217" x="933.7245" y="212.2387">sessionId scope</text></g><!--link Mate to MateStore--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="44" id="lnk8"><path d="M797.4,361.0686 C920.92,377.3586 1094.2429,400.2149 1213.9029,415.9949" fill="none" id="Mate-to-MateStore" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="1218.86,416.6486,1210.4602,411.5063,1213.9029,415.9949,1209.4143,419.4376,1218.86,416.6486" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92.5234" x="933.89" y="369.1725">own and update</text></g><!--link Runtime to RuntimeStore--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="45" id="lnk9"><path d="M1523.32,126.5386 C1595.02,126.5386 1670.76,126.5386 1733.49,126.5386" fill="none" id="Runtime-to-RuntimeStore" style="stroke:#64748B;stroke-width:1.5;"/><polygon fill="#64748B" points="1738.49,126.5386,1729.49,122.5386,1733.49,126.5386,1729.49,130.5386,1738.49,126.5386" style="stroke:#64748B;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92.5234" x="1615.92" y="123.7325">own and update</text></g><?plantuml-src hLTBRnit4Bxlho2IGnF0agp8ZXMvA23B4ke2Vi1oqeikNEv8otYNt99SAKRH_zuPBhcxoWizr0V34icPRxxvvc4dNG7izwUd1tQbQvLn8y7Es2rOotV0rkibuofZLxKid5JiZ_NzNPBymjQwDW8Ox6K62lzuKyb1gPKUVEPxpiRRwUauIzFfkpJB-EJqx68Aaydv6RoVdiDaV3v9nnSV-AbuEqDJfSxg0kn8w4ogtG2zAZSGXHnP8qObbsf4Dl6u70bULhKL1J-4s_xooDJAoH9u9KS7I4UFpSVb7iyMMZcZYmBCaAmC_sz_G4wEFAx1xAM0rjrzQl4Ro5WAETzBRMRCvS0MtlG2JJEf71Z5YoOB3_Vh9sR0rKPP1bz0r4vgDR12LsY4yd6GBjUrOvnLTLf8mVw4TAt5CpXMSPUJqoTkTk06MXKlB0ChTwhnMd870ziWZA-zLq4ySU5yigMptb5bz6SGv9vn0qnfnsHP5L1Yc8W5vU1oQH5ifQrqshoGwxaHkNJuhCOd8kTg1pEMQfUpN5UMrJQepS1VDLWtC60hhIoSi39eBdvZcNK6U4bOBbdWk5KYvgT4i3PmvPL9_XyCvXS3mOZmEQRJDQ5_lC6R0kGUxI8iTvCnekUIeIEB8U9d0vH-YnnqEObkIUTERYKAYUIFQJ7IlR2S6pn0PSoEkSNNfLJuZOqqynef87O3gxRpuKL4dwq3Zh2sRAlD0IsZNPQ-a16CHDaAiw1SuMc-zbb5oDngJEupG4NSci6M2tgsm11P8RSWNWGMk0LyZ73OrkYIPRNXANuRWrit58GWCIp2sMflc2JsMIeoKBAKY-UTeKwnq8KsxFNA__Hks9nd-a0Ojhomq3lnpuGs2WmRJti76MnvNRWLYl2E8vwvaRpu_ddmUheQN
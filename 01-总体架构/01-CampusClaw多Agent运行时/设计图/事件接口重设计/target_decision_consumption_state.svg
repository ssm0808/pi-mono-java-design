<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="675px" preserveAspectRatio="none" style="width:704px;height:675px;background:#FFFFFF;" version="1.1" viewBox="0 0 704 675" width="704px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="428"><text fill="#000000" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="448.8135" x="124.1223" y="23.1318">Accepted Decisions - Consumption State (pending implementation)</text></g><g class="entity" data-qualified-name="PENDING" data-source-line="431" id="ent0001"><rect fill="#F4F7FB" height="50" rx="12.5" ry="12.5" style="stroke:#42576E;stroke-width:0.5;" width="79.23" x="312.24" y="141.5186"/><line style="stroke:#42576E;stroke-width:0.5;" x1="312.24" x2="391.47" y1="166.4674" y2="166.4674"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="59.23" x="322.24" y="158.7125">PENDING</text></g><g class="entity" data-qualified-name="CLAIMED" data-source-line="432" id="ent0002"><rect fill="#F4F7FB" height="50" rx="12.5" ry="12.5" style="stroke:#42576E;stroke-width:0.5;" width="77.7891" x="511.97" y="302.3186"/><line style="stroke:#42576E;stroke-width:0.5;" x1="511.97" x2="589.7591" y1="327.2674" y2="327.2674"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="57.7891" x="521.97" y="319.5125">CLAIMED</text></g><g class="entity" data-qualified-name="COMPLETED" data-source-line="433" id="ent0003"><rect fill="#F4F7FB" height="50" rx="12.5" ry="12.5" style="stroke:#42576E;stroke-width:0.5;" width="100.9009" x="412.41" y="445.6886"/><line style="stroke:#42576E;stroke-width:0.5;" x1="412.41" x2="513.3109" y1="470.6374" y2="470.6374"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="80.9009" x="422.41" y="462.8825">COMPLETED</text></g><g class="entity" data-qualified-name="CANCELED" data-source-line="434" id="ent0004"><rect fill="#FCE8DD" height="50" rx="12.5" ry="12.5" style="stroke:#42576E;stroke-width:0.5;" width="90.7954" x="51.46" y="302.3186"/><line style="stroke:#42576E;stroke-width:0.5;" x1="51.46" x2="142.2554" y1="327.2674" y2="327.2674"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="70.7954" x="61.46" y="319.5125">CANCELED</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="436" id="ent0005"><ellipse cx="351.86" cy="53.0986" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="440" id="ent0010"><ellipse cx="291.86" cy="567.6886" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="291.86" cy="567.6886" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN13" data-source-line="444" id="ent0014"><path d="M6,139.0986 L6,193.9448 A0,0 0 0 0 6,193.9448 L277.7197,193.9448 A0,0 0 0 0 277.7197,193.9448 L277.7197,170.5186 L311.77,166.5186 L277.7197,162.5186 L277.7197,149.0986 L267.7197,139.0986 L6,139.0986 A0,0 0 0 0 6,139.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M267.7197,139.0986 L267.7197,149.0986 L277.7197,149.0986 L267.7197,139.0986" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="207.3525" x="12" y="156.2925">STOPPING alone keeps PENDING.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="197.9961" x="12" y="171.2412">Rollback keeps the previous state.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="250.7197" x="12" y="186.1899">A confirming segment is not a root terminal.</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="450" id="ent0017"><path d="M177.25,284.9486 L177.25,323.3186 L142.68,327.3186 L177.25,331.3186 L177.25,369.6923 A0,0 0 0 0 177.25,369.6923 L476.4678,369.6923 A0,0 0 0 0 476.4678,369.6923 L476.4678,294.9486 L466.4678,284.9486 L177.25,284.9486 A0,0 0 0 0 177.25,284.9486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M466.4678,284.9486 L466.4678,294.9486 L476.4678,294.9486 L466.4678,284.9486" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226.1733" x="183.25" y="302.1425">All three decision tables share this rule.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="191.8643" x="183.25" y="317.0912">Match session_id + execution_id.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="153.1753" x="183.25" y="332.0399">claimed_at remains NULL.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217.5151" x="183.25" y="346.9887">completed_at equals root terminal_at.</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="278.2178" x="183.25" y="361.9374">done / failed / terminated all close pending rows.</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0005" data-entity-2="ent0001" data-link-type="dependency" data-source-line="436" id="lnk6"><path d="M351.86,63.5986 C351.86,80.6486 351.86,111.9386 351.86,136.2886" fill="none" id="*start*-to-PENDING" style="stroke:#42576E;stroke-width:1;"/><polygon fill="#42576E" points="351.86,141.2886,355.86,132.2886,351.86,136.2886,347.86,132.2886,351.86,141.2886" style="stroke:#42576E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="167.6416" x="352.86" y="106.2925">accepted decision committed</text></g><!--link PENDING to CLAIMED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="437" id="lnk7"><path d="M382.52,191.9886 C419.91,221.8286 478.8522,268.8495 516.2622,298.7095" fill="none" id="PENDING-to-CLAIMED" style="stroke:#42576E;stroke-width:1;"/><polygon fill="#42576E" points="520.17,301.8286,515.6313,293.0879,516.2622,298.7095,510.6406,299.3404,520.17,301.8286" style="stroke:#42576E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229.728" x="458.33" y="237.1425">claim wins while execution is RUNNING</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="156.1016" x="495.1432" y="252.0912">and stop_event_id is NULL</text></g><!--link CLAIMED to COMPLETED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="438" id="lnk8"><path d="M535.73,352.6186 C519.61,378.5186 496.8831,415.0343 480.7231,440.9843" fill="none" id="CLAIMED-to-COMPLETED" style="stroke:#42576E;stroke-width:1;"/><polygon fill="#42576E" points="478.08,445.2286,486.233,439.7033,480.7231,440.9843,479.4421,435.4744,478.08,445.2286" style="stroke:#42576E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="142.3652" x="505.22" y="412.8825">acknowledge processing</text></g><!--link PENDING to CANCELED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="439" id="lnk9"><path d="M312.03,186.0686 C306.27,188.7186 300.42,191.4086 294.86,193.9486 C265.17,207.4686 255.81,207.1086 227.86,223.9486 C189.54,247.0286 153.3758,276.4109 127.8258,298.5909" fill="none" id="PENDING-to-CANCELED" style="stroke:#42576E;stroke-width:1;"/><polygon fill="#42576E" points="124.05,301.8686,133.4686,298.9893,127.8258,298.5909,128.2242,292.9481,124.05,301.8686" style="stroke:#42576E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="190.7471" x="228.86" y="237.1425">root execution enters TERMINAL</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="134.4053" x="257.0309" y="252.0912">in the same transaction</text></g><!--link COMPLETED to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0010" data-link-type="dependency" data-source-line="440" id="lnk11"><path d="M418.82,496.1486 C379.04,518.2586 327.8308,546.7004 305.7808,558.9504" fill="none" id="COMPLETED-to-*end*" style="stroke:#42576E;stroke-width:1;"/><polygon fill="#42576E" points="301.41,561.3786,311.22,560.5045,305.7808,558.9504,307.3348,553.5112,301.41,561.3786" style="stroke:#42576E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link CANCELED to *end*--><g class="link" data-entity-1="ent0004" data-entity-2="ent0010" data-link-type="dependency" data-source-line="441" id="lnk12"><path d="M116.63,352.4886 C159.43,404.7986 255.7539,522.5588 282.1639,554.8388" fill="none" id="CANCELED-to-*end*" style="stroke:#42576E;stroke-width:1;"/><polygon fill="#42576E" points="285.33,558.7086,282.7268,549.21,282.1639,554.8388,276.5351,554.2758,285.33,558.7086" style="stroke:#42576E;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="457"><rect fill="none" height="58.2959" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="423.998" x="136.53" y="598.6886"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="380.4541" x="141.53" y="616.8205">Terminal handling never rewrites CLAIMED or COMPLETED.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="413.998" x="141.53" y="632.9191">Accepted user events and committed mode
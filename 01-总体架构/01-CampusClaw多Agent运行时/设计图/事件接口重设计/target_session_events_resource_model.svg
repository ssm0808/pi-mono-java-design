<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="421px" preserveAspectRatio="none" style="width:1425px;height:421px;background:#FFFFFF;" version="1.1" viewBox="0 0 1425 421" width="1425px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="19"><text fill="#000000" font-family="Arial" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="467.5303" x="475.4449" y="23.1318">Session Events - Resources and Ownership (pending implementation)</text></g><!--cluster HTTP boundary--><g class="cluster" data-qualified-name="HTTP boundary" data-source-line="23" id="ent0002"><rect fill="none" height="184" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="254.32" x="366.91" y="189.5186"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="96.7764" x="445.6818" y="203.7125">HTTP boundary</text></g><!--cluster Session authority--><g class="cluster" data-qualified-name="Session authority" data-source-line="27" id="ent0005"><rect fill="none" height="184" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="642.87" x="768.55" y="113.5186"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="109.0781" x="1035.4459" y="127.7125">Session authority</text></g><!--entity Post--><g class="entity" data-qualified-name="HTTP boundary.Post" data-source-line="24" id="ent0003"><rect fill="#F1F1F1" height="49.8975" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="222.3252" x="382.91" y="222.5686"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="202.3252" x="392.91" y="244.7625">POST /sessions/{sessionId}/events</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="176.687" x="392.91" y="259.7112">One user event +
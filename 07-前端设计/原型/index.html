<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusClaw · 前端场景设计</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#2c2724;background:#f8f3f0;font-size:14px}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}a{color:#a9472b;text-decoration:none}button,select{font:inherit;color:inherit;min-height:40px;border:1px solid #ded4cf;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #a9472b;outline-offset:2px}button[aria-pressed=true]{background:#2b2522;color:#fffcfa;border-color:#2b2522}header{display:flex;align-items:center;gap:10px;padding:12px 20px 4px}header img{width:25px;height:25px}h1{font-size:16px;margin:0}header span{font-size:12px;color:#6c625d}header a{margin-left:auto;font-size:12px}.scenes{display:flex;gap:5px;padding:8px 20px;overflow:auto;flex-shrink:0}.scenes button{white-space:nowrap;background:transparent;border-color:transparent;font-size:13px}.scenes button[aria-current=page]{background:#efe4de;color:#2c2724;border-color:#d1c2b9}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 20px;background:#fffcfa;border-block:1px solid #ded4cf}.segmented{display:flex;gap:4px}.tools label{font-size:12px;color:#6c625d}.tools select{max-width:230px}.tools .spacer{flex:1}.tools a{font-size:12px}#goal{margin:0;padding:8px 20px;font-size:12px;color:#6c625d;background:#fffcfa}.canvas{min-height:0;flex:1;background:white;position:relative}iframe{display:block;width:100%;height:100%;border:0;background:#fffcfa}#load-status{position:absolute;inset:0;display:grid;place-content:center;background:#fffcfa;pointer-events:none;color:#6c625d}#load-status[hidden]{display:none}dialog{width:min(760px,calc(100vw - 28px));max-height:85dvh;border:1px solid #ded4cf;border-radius:14px;padding:24px;background:#fffcfa;line-height:1.7;color:#2c2724}dialog::backdrop{background:#2c272455}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:18px;margin:0}h3{font-size:14px;margin:20px 0 8px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid #ded4cf;padding:9px;text-align:left;vertical-align:top;min-width:85px}th{background:#f4ece8}.note{font-size:12px;color:#6c625d}.tools button{font-size:12px}@media(max-width:700px){header{padding:10px 12px 2px}header span{display:none}.scenes{padding:6px 10px}.tools{padding:6px 12px;gap:6px}.tools label{display:none}.tools select{max-width:150px;font-size:12px}.tools .spacer{display:none}#goal{padding:6px 12px;font-size:11px}.tools a{margin-left:auto}dialog{padding:16px}}
</style></head>
<body>
<header><img src="../资源/campusclaw-mark-o1.png" alt=""><h1>CampusClaw · 场景设计</h1><span>九个场景 · 同一交互，两种保真度</span><a href="../README.md">设计目录 ↗</a></header>
<nav class="scenes" id="scenes" aria-label="前端场景"></nav>
<div class="tools"><div class="segmented" role="group" aria-label="原型保真度"><button id="high" aria-pressed="true">高保真</button><button id="low" aria-pressed="false">低保真</button></div><label for="state">初始状态</label><select id="state" aria-label="初始状态，选择后重置演示"></select><button id="reset">重置演示</button><span class="spacer"></span><button id="behavior">交互行为与覆盖</button><a id="document" href="../README.md">场景说明 ↗</a><a id="standalone" href="plan-workbench.html" target="_blank" rel="noopener">独立预览 ↗</a></div>
<p id="goal"></p>
<main class="canvas"><iframe id="preview" title="当前场景交互原型"></iframe><div id="load-status" role="status">正在打开本地原型…</div></main>
<dialog id="details"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close" aria-label="关闭交互说明">×</button></div><p id="coverage" class="note"></p><h3>交互行为</h3><div class="table-scroll"><table><thead><tr><th>当前状态</th><th>动作 / 事件</th><th>反馈</th><th>下一状态</th></tr></thead><tbody id="steps"></tbody></table></div><h3>设计取舍</h3><p id="tradeoff"></p><p class="note">所有场景使用本地示例数据。切换保真度保留当前状态，切换场景或初始状态重置演示。模拟回执和下一步事件位于原型的演示控制区。</p></dialog>
<noscript>请启用 JavaScript 使用场景切换，或从<a href="../README.md">设计目录</a>阅读全部场景。</noscript>
<script src="scenes.js?v=1.0.0"></script><script src="portal.js?v=1.0.0"></script>
</body></html>
